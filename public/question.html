<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>❓ ハテナブロック争奪戦 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#243e77,#17172f);font-family:system-ui,-apple-system,sans-serif;color:#fff}main{max-width:1250px;margin:auto;padding:12px}header,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(20px,3vw,35px);color:#ffe085}a{color:#a6f6ff}button{padding:12px 18px;border:0;border-radius:12px;background:#ffda72;font-weight:800;font-size:18px;color:#2b2540;cursor:pointer}button:disabled{opacity:.5}input{width:73px;font-size:18px;padding:8px}canvas{width:100%;height:auto;display:block;border:3px solid #ffc66c;border-radius:15px;background:#91d6ff}progress{width:100%;accent-color:#ffcf7e}#result{text-align:center;font-size:clamp(21px,3vw,34px);font-weight:850;min-height:44px}#status{min-height:30px}p{color:#cedef5}</style></head><body><main><header><div><a href="./menu.html?stage=1">← レトロゲーム一覧へ戻る</a><h1>❓ 名場面劇場 第2話：ハテナブロック争奪戦</h1></div><div><label>人数 <input id="count" type="number" min="1" max="40" value="40"></label> <button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="760" aria-label="40人がジャンプしてハテナブロックを叩きアイテムの結果で生存を競う"></canvas><div class="actions"><button id="start">▶ ブロック争奪開始！</button><button id="reset">↻ ブロック再配置</button><span id="clock">0.0 / 25秒</span></div><progress id="meter" value="0" max="25"></progress><div id="status" aria-live="polite">コイン・ブースト・安全・落とし穴の4種類！</div><div id="result" aria-live="polite">最後に残るのは何番？</div><p>40人が同時にジャンプ。ブロックを叩いたときの中身がコインなら加点、加速なら次のチャンス、安全なら変化なし、落とし穴なら脱落。各ブロックは叩かれると使用済みに変わります。終盤は隠しボーナスブロックが登場します。独自グラフィックと電子音を使用しています。</p></main><script type="module" src="./question-block.js?v=1"></script></body></html>
