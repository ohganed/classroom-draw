<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔄 巨大洗濯機 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#30486a,#10182f 80%);color:#f5faff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1220px;margin:auto;padding:12px}header,.bar{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}h1{font-size:clamp(23px,4vw,38px);margin:8px 0}a{color:#b5f6ff}button{border:0;border-radius:12px;background:#b5f2e9;color:#26384d;padding:12px 14px;font-size:18px;font-weight:850;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5}#spin{background:#ffe1a1}input{font-size:18px;width:76px;padding:8px}canvas{display:block;width:100%;height:auto;background:#234e78;border:3px solid #9ddfee;border-radius:16px;touch-action:none}#status{min-height:32px;color:#cef5ed;font-weight:700}#result{min-height:52px;font-size:clamp(23px,4vw,40px);font-weight:900;text-align:center}p{color:#cbddeb}</style></head><body><main><header><div><a href="./menu.html?v=4">← 🎮 絵のメニューへ</a><h1>🔄 巨大洗濯機</h1></div><label>参加人数 <input id="count" type="number" min="2" max="40" value="40"></label></header><video id="feed" muted autoplay playsinline hidden></video><canvas id="scene" width="1200" height="760" aria-label="番号付き40個のボールが巨大洗濯機のドラム内を回転し排出口から一つずつ脱落する抽選"></canvas><div class="bar"><button id="camera">📷 指の認識を開始</button><button id="start">▶ 洗濯開始</button><button id="spin">🔄 ドラムを回す！</button><button id="sound">♪ 音 ON</button><button id="reset">↻ リセット</button><strong id="remaining">残り40個</strong></div><div id="status" role="status">人差し指で空中に円を描くと、洗濯機が回り始めます。</div><div id="result" aria-live="polite">最後まで残る番号は？</div><p>人差し指で円を描き、ドラムを回転させてください。右回り・左回り・速度を画面に反映します。一定の回転で排出口が開き、無作為に選ばれたボールが排出されます。どの番号も同じ確率です。カメラなしではドラム画面を指でぐるぐるなぞるか、回転ボタンで遊べます。映像は端末内だけで解析します。</p></main><script type="module" src="./washer-motion.js?v=1"></script></body></html>
