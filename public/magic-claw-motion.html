<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>✊ マジッククレーン | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:#15233d;color:#f4faff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1220px;margin:auto;padding:12px}header,.controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:9px}h1{font-size:clamp(23px,4vw,38px);margin:8px 0}a{color:#a8efff}button{border:0;border-radius:12px;background:#ffe2a0;color:#263348;padding:12px 15px;font-size:18px;font-weight:850;touch-action:manipulation;cursor:pointer}#grip{background:#a7eacf}button:disabled{opacity:.5}input{font-size:18px;padding:8px;width:72px}canvas{display:block;width:100%;height:auto;border:3px solid #a6e8f8;border-radius:15px;touch-action:none}#status{min-height:32px;color:#c9f5ed;font-weight:700}#result{font-size:clamp(23px,4vw,40px);text-align:center;font-weight:900;min-height:52px}p{color:#cedfeb}</style></head><body><main><header><div><a href="./menu.html?v=4">← 🎮 絵のメニューへ</a><h1>✊ グー・パー！ マジッククレーン</h1></div><label>参加人数 <input id="count" type="number" min="2" max="40" value="40"></label></header><video id="feed" muted playsinline autoplay hidden></video><canvas id="scene" width="1200" height="760" aria-label="クレーンがグーパーの動作に合わせてボールをつかみ、放り出す公平な抽選"></canvas><div class="controls"><button id="camera">📷 手の認識を開始</button><button id="start">▶ ゲーム開始</button><button id="grip">✊ つかむ！</button><button id="sound">♪ 音 ON</button><button id="reset">↻ リセット</button><strong id="remaining">残り40個</strong></div><div id="status" role="status">パーでクレーンを開き、グーでボールをつかみます。もう一度パーで放出！</div><div id="result" aria-live="polite">最後に残る番号は？</div><p>パー → グー → パーの順に動かすと、クレーンがボールをまとめて持ち上げて排出口に放り出します。手はクレーン全体を操作するだけで、どの番号をつかむかは公平な無作為抽選です。カメラが難しいときはボタン・画面タップで遊べます。カメラ映像は端末内で処理します。</p></main><script type="module" src="./magic-claw-motion.js?v=1"></script></body></html>
