<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐸 カエル大ジャンプ大会 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#133c4b,#17233b);color:#f5fff3;font-family:system-ui,-apple-system,sans-serif}main{max-width:1210px;margin:auto;padding:12px}header,.controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}h1{font-size:clamp(22px,4vw,38px);margin:8px 0}a{color:#acffe1}button{border:0;border-radius:13px;padding:12px 15px;background:#d7f29d;color:#203c3b;font-size:18px;font-weight:850;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55}#jump{background:#f7d390}#scene{display:block;width:100%;height:auto;touch-action:none;border:3px solid #9ce5be;border-radius:15px;background:#275b73}input{width:70px;font-size:18px;padding:7px}#status{min-height:33px;color:#d5fcd5;font-weight:750}#result{text-align:center;min-height:50px;font-size:clamp(23px,4vw,40px);font-weight:900}p{color:#cae1d5}</style></head><body><main><header><div><a href="./menu.html?v=4">← 🎮 絵のメニューへ</a><h1>🐸 カエル大ジャンプ大会</h1></div><label>参加人数 <input id="count" type="number" min="2" max="40" value="40"></label></header><video id="feed" muted playsinline autoplay hidden></video><canvas id="scene" width="1200" height="760" aria-label="40匹の番号付きカエルが両手の上げ下げでジャンプし、着地するたびに脱落する抽選"></canvas><div class="controls"><button id="camera">📷 両手の認識を開始</button><button id="start">▶ 大会開始</button><button id="jump">🙌 ジャンプ！</button><button id="sound">♪ 音 ON</button><button id="reset">↻ リセット</button><strong id="remaining">残り40匹</strong></div><div id="status" role="status">カメラに両手を映し、両手を上げてから下ろすとカエルが跳びます。</div><div id="result" aria-live="polite">最後まで残るカエルは何番？</div><p>両手を上げると全カエルがジャンプ、下ろすと着地してランダムな足場が沈みます。番号ごとの有利・不利はありません。手認識が難しい場合は「ジャンプ！」ボタンや池のタップでも遊べます。映像は端末内で処理します。</p></main><script type="module" src="./frog-motion.js?v=1"></script></body></html>
