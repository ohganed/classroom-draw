<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172b3b"><title>A列車で行こう | だれの番？</title><style>
*{box-sizing:border-box}body{margin:0;background:#102331;color:#f4f6f4;font-family:system-ui,-apple-system,sans-serif}main{max-width:1300px;margin:auto;padding:12px}.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px}a{color:#c3e5ff}h1{font-size:clamp(20px,3vw,32px);margin:4px 0}.settings{display:flex;align-items:center;gap:12px;flex-wrap:wrap}label{font-weight:600}input{width:64px;padding:8px;border-radius:8px;font-size:16px}button{cursor:pointer;padding:12px 19px;border:0;border-radius:10px;font-size:16px;font-weight:750;background:#e8f0ee;color:#15242a}button.primary{background:#ffcf6d}button:disabled{opacity:.5}canvas{display:block;width:100%;height:auto;background:#b4d6a9;border-radius:13px}#result{text-align:center;font-size:clamp(19px,3vw,30px);font-weight:800;min-height:45px;margin:10px}#status{color:#d4e4ed;margin:8px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.note{font-size:13px;color:#bad0da}progress{width:100%;height:12px;accent-color:#ffce6b} @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main><div class="head"><div><a href="./">← だれの番？へ戻る</a><h1>🚂 A列車で行こう</h1></div><div class="settings"><label>参加人数 <input id="count" type="number" min="1" max="99" value="40"></label><button id="sound" aria-pressed="false">♪ 音 OFF</button></div></div><canvas id="rail" width="1200" height="740" role="img" aria-label="全列車が同じ始発駅から出発する鉄道抽選レース"></canvas><div class="actions"><button class="primary" id="start">▶ 出発進行！</button><button id="reset">↻ 線路を再配置</button><span id="clock" style="margin:auto 0">0.0 / 35秒</span></div><progress id="meter" value="0" max="35"></progress><div id="status" aria-live="polite">🚉 共通始発駅で待機中</div><div id="result" aria-live="polite">💐 花束駅には誰が到着する？</div><p class="note">当選者は走行前に均等な確率で抽選します。ポイント・ワープトンネル・橋・追い越しは演出です。光の点滅はありません。動きを減らす設定では静止画に切り替わります。</p></main><script type="module" src="./train-race.js?v=2"></script></body></html>
