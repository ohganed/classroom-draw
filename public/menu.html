<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101c30"><title>ゲームを選ぶ | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;color:#f8f7ff;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at top,#2a3767,#12192d 74%)}main{max-width:1380px;margin:auto;padding:15px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:8px 0;font-size:clamp(25px,3vw,42px)}a{color:inherit}header a{font-weight:700;color:#b5f3ff;text-decoration:none}#search{width:min(100%,450px);background:#fff;color:#273850;border:0;border-radius:14px;font-size:19px;padding:13px 16px}.menu-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#labels-toggle{border:2px solid #c6d7f8;color:#fff;background:#354979;border-radius:12px;padding:12px 20px;font-size:18px;font-weight:800;cursor:pointer}#labels-toggle[aria-pressed="true"]{background:#f4d588;color:#192c48;border-color:#f4d588}.label[hidden]{display:none!important}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:24px 0}.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1.15;min-height:130px;background:linear-gradient(145deg,var(--a),var(--b));border:2px solid rgba(255,255,255,.21);box-shadow:0 8px 22px rgba(0,0,0,.18);border-radius:20px;text-decoration:none;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}.tile:active{transform:scale(.96)}.tile:focus-visible{outline:4px solid #fce293;outline-offset:3px}.pic{font-size:clamp(76px,10vw,140px);line-height:1.2;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25));transform:rotate(-5deg)}.tile:nth-child(3n) .pic{transform:rotate(8deg)}.label{font-size:clamp(11px,1.35vw,16px);font-weight:800;max-width:96%;text-align:center;line-height:1.4;margin-top:12px;text-shadow:0 2px 3px #25304f}#empty{display:none}p{color:#cfddf5}@media(min-width:700px){#grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}.tile{aspect-ratio:1.1}}@media(min-width:1100px){#grid{grid-template-columns:repeat(6,minmax(0,1fr))}}@media(hover:hover){.tile:hover{transform:translateY(-5px);box-shadow:0 14px 26px rgba(0,0,0,.3)}}body{transition:background .3s}body[data-level="1"]{background:linear-gradient(160deg,#e6eef8,#c5d4ea);color:#203955}body[data-level="1"] header a,body[data-level="1"] p{color:#415d7c}body[data-level="1"] .tile{box-shadow:0 3px 10px #223b5630}body[data-level="2"]{background:linear-gradient(155deg,#234962,#29305e)}body[data-level="3"]{background:radial-gradient(ellipse at top,#623489,#16112b 75%)}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.nav a{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:12px 20px;border-radius:16px;background:#f4e5b9;color:#203354;text-decoration:none;font-size:19px;font-weight:800}.nav a.next{font-size:28px;background:#ffdd86}.tier-caption{font-weight:750}
body[data-level="1"] .tile{border-color:#bccfe2}body[data-level="1"] .label{text-shadow:none;color:#223b54}body[data-level="1"] .pic{filter:none}body[data-level="1"] .tile:nth-child(n) .pic{transform:none}body[data-level="2"] .tile{border-color:#b3d9f5aa}body[data-level="3"] .tile{border-color:#ffd77588;box-shadow:0 8px 26px #e26fff20}body[data-level="3"] .tile:focus-visible{outline-color:#ffe7a3}.nav a:focus-visible{outline:3px solid #ffdc88;outline-offset:3px}@media(prefers-reduced-motion:reduce){body,.tile{transition:none!important}}</style></head><body><main><header><div><a href="./">← 抽選画面に戻る</a><h1 id="tier-title">抽選方法</h1><p id="tier-description" class="tier-caption">抽選方法を選んでください。</p></div><div class="menu-controls"><button id="labels-toggle" type="button" aria-pressed="true">文字</button><input id="search" type="search" placeholder="名前で探す（任意）" aria-label="ゲームの名前で探す"></div></header><nav class="nav" aria-label="抽選モードの階層"><a id="back" href="./index.html">← 戻る</a><a id="next" class="next" href="./menu.html?level=2" aria-label="はてな2 次のゲームモードへ">？②</a></nav><div id="grid"></div><p id="empty">該当するゲームがありません。</p></main><script type="module">
import { MODE_CATALOG } from "./mode-catalog.js";
const level=Math.max(1,Math.min(3,Number(new URLSearchParams(location.search).get('level'))||1));
document.body.dataset.level=String(level);
const tierTitles=['','抽選ゲーム','体感ゲーム','アーケード'];
const tierDescriptions=['','懐かしいゲームや装置を使った抽選','先生の動きで結果が変わる体感型の抽選','光・音・動きが広がるゲームセンター'];
document.getElementById('tier-title').textContent=tierTitles[level];
document.getElementById('tier-description').textContent=tierDescriptions[level];
document.getElementById('back').href=level===1?'./index.html':'./menu.html?level='+(level-1);
const next=document.getElementById('next');
if(level===3)next.remove();else{next.href='./menu.html?level='+(level+1);next.textContent='？'+(['','②','③'][level]);next.setAttribute('aria-label','次の階層へ');}
const BASIC=new Set(['numbers','die','lottery','roulette','galton']);
const RETRO=new Set(['slot','pengo','dig','minesweeper','daruma','race','horse','pinball','maze','crane','machine','karakuri','invaders','mazechase','fallingpuzzle','brickbreaker','amidarace','towerladders','tortoisehare','catcoin','gourd','kappa','dogstick','lovedog','digdog','monkey','detour','botamochi','washer','ghost','penguin','balloon','bowling','trolley','train']);
const MOTION=new Set(['marble','piratetilt','handar','egggrow','papersumo','kusudama','frogmotion','piratestorm','volcano','balloonmotion','washermotion','magicclaw','blackhole','robotmotion','ufomotion','mirrordance','funkyrobot','puppetdance','airdancer','ninjadance','wobblydance','darumapose','alien','frog','robot','baby']);
const tierOf=id=>BASIC.has(id)?0:RETRO.has(id)?1:MOTION.has(id)?2:3;
const icons={ultrabattle:'⚡',numbers:'🔢',marble:'🔵',train:'🚂',road:'🚗',bomb:'💣',qix:'✏️',medal:'🪙',ice:'🧊',elevator:'🛗',pyramid:'🔺',trampoline:'🐭',gold:'⛏️',pipe:'🟢',question:'❓',fire:'🔥',flag:'🚩',speedloop:'💨',obstacle:'🏃',chain:'⚙️',piratetilt:'🚢',handar:'✋',egggrow:'🥚',papersumo:'🥋',kusudama:'🪅',frogmotion:'🐸',piratestorm:'🌊',volcano:'🌋',balloonmotion:'🎈',washermotion:'🔄',magicclaw:'✊',blackhole:'👐',robotmotion:'🤖',ufomotion:'🛸',mirrordance:'🪩',funkyrobot:'🤖',puppetdance:'🎪',airdancer:'🌬️',ultrabattle:'⚡',ninjadance:'🥷',wobblydance:'🥴',darumapose:'🙌',slot:'🎰',pengo:'🐧',dig:'💎',minesweeper:'💣',daruma:'🧍',die:'🎲',lottery:'🎱',roulette:'🎯',race:'🏁',horse:'🐎',pinball:'🕹️',galton:'⚪',maze:'🌀',crane:'🏗️',machine:'🦾',karakuri:'⚙️',invaders:'👾',mazechase:'👻',fallingpuzzle:'🧩',brickbreaker:'🧱',amidarace:'🪜',towerladders:'🪜',gorilla:'🦍',barrelescape:'🛢️',castlefinale:'🏰',drumarcade:'🥁',starquintet:'⭐',chestnut:'🌰',tortoisehare:'🐢',catcoin:'🐱',gourd:'🎃',kappa:'🥒',dogstick:'🐕',lovedog:'🐶',digdog:'🦴',monkey:'🐒',detour:'🚶',botamochi:'🍡',washer:'🧺',ghost:'👻',treasure2:'🏝️',pirate:'🏴‍☠️',penguin:'🐧',balloon:'🎈',bowling:'🎳',alien:'👽',frog:'🐸',trolley:'🚋',robot:'🤖',baby:'👶'};
const palettes=[['#6e4bb7','#372979'],['#16829c','#1d3d86'],['#ac516b','#5b3478'],['#337a68','#214960'],['#c48637','#774a62'],['#5c69ba','#37418a']];
const grid=document.getElementById('grid'),search=document.getElementById('search'),toggle=document.getElementById('labels-toggle');
let showLabels=true;
toggle.addEventListener('click',()=>{showLabels=!showLabels;toggle.setAttribute('aria-pressed',String(showLabels));for(const label of grid.querySelectorAll('.label'))label.hidden=!showLabels;});
let options=MODE_CATALOG.filter(m=>tierOf(m.value)===level);
if(level===3)options.push({value:'ultrabattle',name:'⚡ 光の巨人 VS 40大怪獣'});
function render(){grid.replaceChildren();const q=search.value.toLocaleLowerCase();let found=0;
 options.forEach((m,i)=>{if(q&&!m.name.toLocaleLowerCase().includes(q))return;found++;
 const tile=document.createElement('a');tile.className='tile';tile.href=m.value==='ultrabattle'?'./ultra-battle.html':'./index.html?mode='+encodeURIComponent(m.value);const palette=level===1?['#eef4fa','#d7e5f3']:level===2?['#417c9d','#343d78']:palettes[i%palettes.length];tile.style.setProperty('--a',palette[0]);tile.style.setProperty('--b',palette[1]);tile.setAttribute('aria-label',m.name+'を開く');
 const pic=document.createElement('span');pic.className='pic';pic.textContent=icons[m.value]||'🎮';pic.setAttribute('aria-hidden','true');
 const label=document.createElement("span");label.className="label";label.textContent=m.name;label.hidden=!showLabels;tile.append(pic,label);grid.append(tile)});
 document.getElementById('empty').style.display=options.length&&!found?'block':'none';
}
search.addEventListener('input',render);render();
</script></body></html>
