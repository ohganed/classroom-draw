<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101c30"><title>ゲームを選ぶ | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;color:#f8f7ff;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at top,#2a3767,#12192d 74%)}main{max-width:1380px;margin:auto;padding:15px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:8px 0;font-size:clamp(25px,3vw,42px)}a{color:inherit}header a{font-weight:700;color:#b5f3ff;text-decoration:none}#search{width:min(100%,450px);background:#fff;color:#273850;border:0;border-radius:14px;font-size:19px;padding:13px 16px}.menu-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#labels-toggle{border:2px solid #c6d7f8;color:#fff;background:#354979;border-radius:12px;padding:12px 20px;font-size:18px;font-weight:800;cursor:pointer}#labels-toggle[aria-pressed="true"]{background:#f4d588;color:#192c48;border-color:#f4d588}.label[hidden]{display:none!important}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:24px 0}.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1.15;min-height:130px;background:linear-gradient(145deg,var(--a),var(--b));border:2px solid rgba(255,255,255,.21);box-shadow:0 8px 22px rgba(0,0,0,.18);border-radius:20px;text-decoration:none;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}.tile:active{transform:scale(.96)}.tile:focus-visible{outline:4px solid #fce293;outline-offset:3px}.pic{font-size:clamp(76px,10vw,140px);line-height:1.2;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25));transform:rotate(-5deg)}.tile:nth-child(3n) .pic{transform:rotate(8deg)}.label{font-size:clamp(11px,1.35vw,16px);font-weight:800;max-width:96%;text-align:center;line-height:1.4;margin-top:12px;text-shadow:0 2px 3px #25304f}#empty{display:none}p{color:#cfddf5}@media(min-width:700px){#grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}.tile{aspect-ratio:1.1}}@media(min-width:1100px){#grid{grid-template-columns:repeat(6,minmax(0,1fr))}}@media(hover:hover){.tile:hover{transform:translateY(-5px);box-shadow:0 14px 26px rgba(0,0,0,.3)}}#crumb{display:flex;gap:14px;align-items:center;margin:12px 0}#crumb[hidden]{display:none}#back{background:#d8e7fa;color:#20334e;border:0;border-radius:14px;padding:11px 16px;font-weight:800;font-size:17px}.category-tile{cursor:pointer}.category-tile .pic{font-size:clamp(88px,11vw,150px)}</style></head><body><main><header><div><a href="./">← 抽選画面に戻る</a><h1>🎮 ゲームを選ぼう！</h1><p>主役の絵を押すと、そのゲームを開きます。</p></div><div class="menu-controls"><button id="labels-toggle" type="button" aria-pressed="false">文字</button><input id="search" type="search" placeholder="名前で探す（任意）" aria-label="ゲームの名前で探す"></div></header><nav id="crumb" hidden><button id="back" type="button">← ジャンル</button><strong id="section-name"></strong></nav><div id="grid"></div><p id="empty">該当するゲームがありません。</p></main><script type="module">
const icons={numbers:'🔢',marble:'🔵',train:'🚂',road:'🚗',bomb:'💣',qix:'✏️',medal:'🪙',ice:'🧊',elevator:'🛗',pyramid:'🔺',trampoline:'🐭',gold:'⛏️',pipe:'🟢',question:'❓',fire:'🔥',flag:'🚩',speedloop:'💨',obstacle:'🏃',chain:'⚙️',piratetilt:'🚢',handar:'✋',egggrow:'🥚',papersumo:'🥋',kusudama:'🪅',frogmotion:'🐸',piratestorm:'🌊',volcano:'🌋',balloonmotion:'🎈',washermotion:'🔄',magicclaw:'✊',blackhole:'👐',robotmotion:'🤖',ufomotion:'🛸',mirrordance:'🪩',funkyrobot:'🤖',puppetdance:'🎪',airdancer:'🌬️',hammerarcade:'🔨',hyperrun:'🏃',ultrabattle:'⚡',ninjadance:'🥷',wobblydance:'🥴',darumapose:'🙌',slot:'🎰',pengo:'🐧',dig:'💎',minesweeper:'💣',daruma:'🧍',die:'🎲',lottery:'🎱',roulette:'🎯',race:'🏁',horse:'🐎',pinball:'🕹️',galton:'⚪',maze:'🌀',crane:'🏗️',machine:'🦾',karakuri:'⚙️',invaders:'👾',mazechase:'👻',fallingpuzzle:'🧩',brickbreaker:'🧱',amidarace:'🪜',towerladders:'🪜',gorilla:'🦍',barrelescape:'🛢️',castlefinale:'🏰',drumarcade:'🥁',starquintet:'⭐',chestnut:'🌰',tortoisehare:'🐢',catcoin:'🐱',gourd:'🎃',kappa:'🥒',dogstick:'🐕',lovedog:'🐶',digdog:'🦴',monkey:'🐒',detour:'🚶',botamochi:'🍡',washer:'🧺',ghost:'👻',treasure2:'🏝️',pirate:'🏴‍☠️',penguin:'🐧',balloon:'🎈',bowling:'🎳',alien:'👽',frog:'🐸',trolley:'🚋',robot:'🤖',baby:'👶'};
const palettes=[['#6e4bb7','#372979'],['#16829c','#1d3d86'],['#ac516b','#5b3478'],['#337a68','#214960'],['#c48637','#774a62'],['#5c69ba','#37418a']];
const grid=document.getElementById('grid'),search=document.getElementById('search'),toggle=document.getElementById('labels-toggle');
let showLabels=false;

const groups=[
{id:'body',name:'体感・カメラ',pic:'🕺',m:'handar egggrow papersumo kusudama frogmotion piratestorm volcano balloonmotion washermotion magicclaw blackhole robotmotion ufomotion mirrordance funkyrobot puppetdance airdancer ninjadance wobblydance darumapose'},
{id:'arcade',name:'アーケード',pic:'🕹️',m:'hammerarcade ultrabattle hyperrun invaders mazechase fallingpuzzle brickbreaker drumarcade pengo dig minesweeper qix medal pinball crane'},
{id:'race',name:'レース・競争',pic:'🏁',m:'race horse road obstacle trampoline pyramid flag speedloop maze robot baby gorilla barrelescape catcoin tortoisehare'},
{id:'adventure',name:'冒険・サバイバル',pic:'🏝️',m:'marble ice elevator gold pipe question fire piratetilt pirate treasure2 ghost frog penguin balloon trolley'},
{id:'machines',name:'抽選機・からくり',pic:'🎰',m:'numbers slot die lottery roulette galton machine karakuri chain amidarace towerladders washer bowling'},
{id:'stories',name:'ことわざ・物語',pic:'🎭',m:'chestnut gourd kappa dogstick lovedog digdog monkey detour botamochi starquintet alien castlefinale'},
{id:'all',name:'すべてのゲーム',pic:'🎮',m:''}
];
let options=[],category=new URLSearchParams(location.search).get('category');
const crumb=document.getElementById('crumb'),section=document.getElementById('section-name'),owner=new Map();
if(!groups.some(x=>x.id===category))category=null;
for(const c of groups.filter(x=>x.id!=='all'))for(const mode of c.m.split(' '))if(mode&&!owner.has(mode))owner.set(mode,c.id);
toggle.onclick=()=>{showLabels=!showLabels;toggle.setAttribute('aria-pressed',String(showLabels));render()};
document.getElementById('back').onclick=()=>{category=null;search.value='';history.replaceState(null,'',location.pathname);render()};
try{const res=await fetch('./index.html',{cache:'no-store'});if(!res.ok)throw Error('fetch');const doc=new DOMParser().parseFromString(await res.text(),'text/html');
options=Array.from(doc.querySelectorAll('#mode option')).map(o=>({value:o.value,name:o.textContent.trim()}));
options.unshift({value:'ultrabattle',name:'⚡ 光の巨人 VS 40大怪獣'},{value:'hyperrun',name:'🏃 ハイパー・モーションラン'},{value:'hammerarcade',name:'🔨 ハンマー先生！'});
}catch{grid.textContent='ゲーム一覧を読み込めませんでした。オンラインで開き直してください。'}
const linkOf=v=>v==='hammerarcade'?'./hammer-arcade.html':v==='hyperrun'?'./hyper-motion-run.html':v==='ultrabattle'?'./ultra-battle.html':'./index.html?mode='+encodeURIComponent(v);
function tile(pic,name,i,url,choose){
 const element=document.createElement(choose?'button':'a');element.className='tile'+(choose?' category-tile':'');
 if(choose){element.type='button';element.onclick=choose}else element.href=url;
 element.style.setProperty('--a',palettes[i%palettes.length][0]);element.style.setProperty('--b',palettes[i%palettes.length][1]);
 element.setAttribute('aria-label',name+(choose?'を選ぶ':'を開く'));
 const artwork=document.createElement('span');artwork.className='pic';artwork.textContent=pic;artwork.setAttribute('aria-hidden','true');
 const label=document.createElement('span');label.className='label';label.textContent=name;label.hidden=!showLabels;
 element.append(artwork,label);grid.append(element)
}
function render(){
 grid.replaceChildren();const q=search.value.trim().toLocaleLowerCase(),searching=q.length>0;
 crumb.hidden=!category&&!searching;section.textContent=searching?'🔍 検索結果':groups.find(x=>x.id===category)?.name||'';
 if(!category&&!searching)groups.forEach((c,i)=>tile(c.pic,c.name,i,null,()=>{category=c.id;history.replaceState(null,'','?category='+encodeURIComponent(category));render()}));
 else{const visible=options.filter(m=>searching?m.name.toLocaleLowerCase().includes(q):category==='all'||(owner.get(m.value)||'all')===category);
 visible.forEach((m,i)=>tile(icons[m.value]||'🎮',m.name,i,linkOf(m.value)));
 document.getElementById('empty').style.display=visible.length?'none':'block';
 return}
 document.getElementById('empty').style.display='none';
}
search.oninput=render;window.onpopstate=()=>{category=new URLSearchParams(location.search).get('category');render()};render();
</script></body></html>
