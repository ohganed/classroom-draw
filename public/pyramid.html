<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔺 ピラミッド大ジャンプ | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#4a2483,#14162e 75%);color:#f5f6ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1230px;margin:auto;padding:12px}header,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(22px,3vw,34px);color:#ffe57a}a{color:#a7efff}button{border:0;border-radius:12px;padding:12px 18px;font-size:18px;font-weight:800;background:linear-gradient(100deg,#ffcd5d,#ff86c4);color:#29163f;cursor:pointer}button:disabled{opacity:.5}input{width:73px;padding:8px;font-size:19px}canvas{display:block;width:100%;height:auto;border-radius:16px;border:3px solid #c49bff;background:#201547}#result{text-align:center;font-size:clamp(21px,3vw,32px);font-weight:850;min-height:45px}#status{min-height:28px;color:#d7eaff}progress{width:100%;accent-color:#f8cb69}p{color:#cecee8}</style></head><body><main><header><div><a href="./">← だれの番？に戻る</a><h1>🔺 ピラミッド大ジャンプ</h1></div><div><label>参加人数 <input id="count" type="number" min="1" max="40" value="40"></label> <button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="760" aria-label="番号付き40人がピラミッドの足場に飛び乗る抽選ゲーム"></canvas><div class="actions"><button id="start">▶ 大ジャンプ開始！</button><button id="reset">↻ 配置を変える</button><span id="clock">0.0 / 25秒</span></div><progress id="meter" max="25" value="0"></progress><div id="status" aria-live="polite">足場の色が危険色になったら脱落！</div><div id="result" aria-live="polite">最後まで生き残るのは何番？</div><p>色の変わる足場とジャンプを組み合わせたオリジナル抽選です。着地した足場が赤く崩れると、その番号が脱落します。終盤は救出円盤が登場。勝敗を決める足場と動きを生成してから番号をランダムに割り当てるため、全番号が均等に当選します。激しい点滅はありません。</p></main><script type="module" src="./pyramid-jump.js?v=1"></script></body></html>
