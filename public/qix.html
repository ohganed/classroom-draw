<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>陣取り大作戦 | だれの番？</title><style>*{box-sizing:border-box}body{background:#10192b;color:#f1f7ff;font-family:system-ui,-apple-system,sans-serif;margin:0}main{max-width:1250px;margin:auto;padding:12px}header,.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(20px,3vw,34px)}a{color:#b7e5ff}button{background:#ffe07e;color:#192339;font-weight:800;font-size:18px;padding:12px 18px;border:0;border-radius:11px;cursor:pointer}button:disabled{opacity:.5}input{width:72px;font-size:19px;padding:8px}canvas{width:100%;height:auto;background:#071b2a;border-radius:14px;display:block}#result{text-align:center;font-size:clamp(22px,3vw,35px);font-weight:850;min-height:52px;margin:10px}#status{min-height:27px}progress{width:100%;accent-color:#45e9d4}p{color:#b5c9da}</style></head><body><main><header><div><a href="./menu.html?stage=1">← レトロゲーム一覧へ戻る</a><h1>✏️ 陣取り大作戦（QIX型）</h1></div><div><label>人数 <input id="count" type="number" min="1" max="40" value="40"></label> <button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="750" aria-label="線で領域を分断し、囲い込まれた番号が脱落する陣取り抽選"></canvas><div class="controls"><button id="start">▶ 陣取り開始！</button><button id="reset">↻ 再配置</button><span id="clock">0.0 / 25秒</span></div><progress id="meter" max="25" value="0"></progress><div id="status" aria-live="polite">線が閉じると、切り取られた領域の番号が脱落します</div><div id="result" aria-live="polite">最後の1人は何番？</div><p>線はフィールドの端から端まで伸び、閉じた瞬間に片側の領域が消えます。番号はその領域内にいたときだけ脱落。終盤は連続分断で大逆転！ 番号の割り当ては領域と勝敗が決まった後に均等に行います。昔の陣取りアーケードゲームを発想源にしたオリジナルモードです。</p></main><script type="module" src="./qix-territory.js?v=1"></script></body></html>
