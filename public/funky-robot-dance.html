<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🤖 ファンキー・ロボットダンス | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:#121329;color:#f7f2ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1250px;margin:auto;padding:12px}header,.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}h1{font-size:clamp(22px,4vw,38px);margin:8px 0}a{color:#b0f4ff}button{border:0;border-radius:12px;padding:11px 14px;background:#ffe29d;color:#24283d;font-size:18px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}input{width:68px;font-size:18px;padding:6px}canvas{display:block;width:100%;height:auto;border:3px solid #d0a3ff;border-radius:15px;background:#22234b}#status{min-height:30px;color:#d7eaff;font-weight:700}#result{font-size:clamp(22px,4vw,42px);font-weight:900;text-align:center;min-height:50px}p{color:#d4cee4}</style></head><body><main><header><div><a href="./menu.html?v=4">← 🎮 絵でゲームを選ぶ</a><h1>🤖 ファンキー・ロボットダンス</h1></div><label>参加人数 <input id="count" type="number" min="2" max="40" value="40"></label></header><video id="feed" autoplay muted playsinline hidden></video><canvas id="stage" width="1200" height="760" aria-label="頭肩腕の動きをまねして踊る40人のダンスバトル"></canvas><div class="controls"><button id="camera">📷 全身認識を開始</button><button id="start">▶ ダンス開始</button><button id="beat">🎵 次の8拍</button><button id="sound">♪ 音 ON</button><button id="reset">↻ リセット</button><strong id="tempo" aria-live="off">116 BPM</strong><strong id="remaining">残り40人</strong></div><div id="status" role="status">カメラから少し離れ、頭・肩・両肘・両手首が映る位置で踊ってください。</div><div id="result" aria-live="polite">最後のソロダンサーは何番？</div><p>先生の頭・肩・肘・手首の動きを40体のロボットがまねして踊ります。体を速く動かすほど80～200 BPMの範囲で音楽が速まり、8拍ごとの公平な抽選も早く進みます。動きを止めると音楽も一時停止します。最後の1人が優勝します。手の動かし方やダンスの上手さは当選確率に影響しません。カメラ映像は端末内で処理します。カメラなしでも自動ダンスで遊べます。</p></main><script type="module" src="./funky-robot-dance.js?v=2"></script></body></html
