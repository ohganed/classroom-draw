<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎈 風船ふわふわ大決戦 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:#14283f;color:#f4fbff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1220px;margin:auto;padding:12px}header,.controls{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}h1{font-size:clamp(23px,3.7vw,37px);margin:8px 0}a{color:#b7efff}button{border:0;border-radius:13px;background:#ffe4a6;color:#2a374f;padding:12px 15px;font-size:18px;font-weight:850;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5}#wind{background:#9de7f0}input{width:72px;padding:8px;font-size:18px}canvas{display:block;width:100%;height:auto;border:3px solid #a7eeed;border-radius:15px;touch-action:none;background:#7ac9e1}#status{min-height:34px;color:#d1f8ec;font-weight:700}#result{min-height:54px;font-size:clamp(23px,4vw,40px);text-align:center;font-weight:900}p{color:#cbdeea}</style></head><body><main><header><div><a href="./menu.html?v=4">← 🎮 絵のメニューへ</a><h1>🎈 風船ふわふわ大決戦</h1></div><label>参加人数 <input id="count" type="number" min="2" max="40" value="40"></label></header><video id="feed" muted playsinline autoplay hidden></video><canvas id="scene" width="1200" height="760" aria-label="40個の番号付き風船が風で漂い、トゲに接触して破裂する抽選"></canvas><div class="controls"><button id="camera">📷 手の認識を開始</button><button id="start">▶ 決戦スタート</button><button id="wind">💨 風を起こす！</button><button id="sound">♪ 音 ON</button><button id="reset">↻ リセット</button><strong id="remaining">残り40個</strong></div><div id="status" role="status">手を左右に振ると風が吹きます。認識できない場合は風ボタンを押してください。</div><div id="result" aria-live="polite">最後まで残る風船は何番？</div><p>風は全風船に同時に作用します。番号に関係なく、無作為に選ばれた風船が障害物にぶつかって割れます。最後の1個が当選。画面のタップでも風を起こせます。カメラ映像は端末内のみで処理します。</p></main><script type="module" src="./balloon-motion.js?v=1"></script></body></html>
