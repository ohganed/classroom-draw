<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>💨 超高速ループ競争 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#27246b,#101c35 75%);color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1250px;margin:auto;padding:12px}header,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(21px,3vw,35px);color:#ffe787}a{color:#b9f8ff}button{cursor:pointer;border:0;border-radius:12px;padding:12px 17px;font-weight:800;font-size:18px;background:#ffdb76;color:#24354f}button:disabled{opacity:.5}input{width:72px;font-size:18px;padding:8px}canvas{display:block;width:100%;height:auto;border:3px solid #81f1d6;border-radius:16px;background:#24326d}progress{width:100%;accent-color:#80efc1}#result{min-height:46px;text-align:center;font-size:clamp(21px,3vw,33px);font-weight:850}#status{min-height:26px}p{color:#d5e6f3}</style></head><body><main><header><div><a href="./menu.html?stage=1">← レトロゲーム一覧へ戻る</a><h1>💨 名場面劇場：超高速ループ競争</h1></div><div><label>参加人数 <input id="count" type="number" min="1" max="40" value="40"></label><button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="760" aria-label="40人が5レーンで坂道、360度ループ、ジャンプ台を走り、走行距離で順位が決まるレース"></canvas><div class="actions"><button id="start">▶ 超高速スタート！</button><button id="reset">↻ 新しいコースで抽選</button><span id="clock">0.0 / 27秒</span></div><progress id="meter" value="0" max="27"></progress><div id="status" aria-live="polite">40人同時スタート！ ループとショートカットで順位が変わります。</div><div id="result" aria-live="polite">誰が最も遠くまで走る？</div><p>全員が同じ長さのコースを周回します。走行距離に応じて坂道・360度ループ・ジャンプ台の位置を通過し、ブーストやショートカットで実際の走行距離が変化します。27秒後に最も遠くへ進んだ番号が当選。番号は走行条件とは独立にランダムに割り当てます。独自のキャラクター・背景・電子効果音を使用しています。</p></main><script type="module" src="./speed-loop.js?v=1"></script></body></html>
