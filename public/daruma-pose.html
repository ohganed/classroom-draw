<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🙌 先生が鬼！だるまさんが転んだ</title><style>body{margin:0;background:#192946;color:#fff;font-family:system-ui}main{max-width:1200px;margin:auto;padding:12px}a{color:#bdf6ff}h1{font-size:clamp(24px,4vw,38px)}canvas{width:100%;border:3px solid #aff0d7;border-radius:15px;box-sizing:border-box}button,select,input{font-size:17px;border:0;border-radius:10px;padding:12px;background:#ffe8ae;color:#20334a;font-weight:bold}button{cursor:pointer}.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}#status,#result{font-weight:bold;font-size:clamp(18px,3vw,28px);margin:10px 0}p{color:#c9daed}</style></head><body><main><a href="./menu.html?v=4">← 🎮 絵のメニューへ</a><h1>🙌 先生が鬼！だるまさんが転んだ</h1><video id="video" autoplay muted playsinline hidden></video><canvas id="stage" width="1200" height="760"></canvas><div class="bar"><label>人数 <input id="count" type="number" min="2" max="40" value="40" style="width:67px"></label><label>勝利条件 <select id="rule"><option value="distance">最も進んだ人</option><option value="last">最後まで残った人</option></select></label><button id="camera">📷 上半身認識</button><button id="start">▶ 開始</button><button id="call">🙌 だるまさんが</button><button id="stop">❌ 転んだ！</button><button id="sound">♪ 音ON</button><button id="reset">↻ リセット</button></div><div id="status" role="status">両腕を上げると「だるまさんが」、両腕を胸の前でクロスすると「転んだ！」</div><div id="result" aria-live="polite">勝つのは何番？</div><p>カメラに肩・肘・手首が映るようにしてください。🙌で前進、❌で停止判定。遅れた子は後退し、最後まで残るルールでは脱落します。位置・反応速度などの初期条件は番号と無関係に毎回シャッフル。カメラなしでもボタンで操作できます。</p></main><script type="module" src="./daruma-pose.js?v=1"></script></body></html>
