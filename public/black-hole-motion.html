<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>👐 魔法のブラックホール | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:#090e25;color:#f4f4ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1220px;margin:auto;padding:12px}header,.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:clamp(23px,4vw,38px);margin:8px 0}a{color:#afedff}button{font-size:18px;font-weight:800;border:0;border-radius:13px;padding:12px 15px;background:#cec3ff;color:#282647;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5}#pulse{background:#a2e6e5}input{width:70px;font-size:18px;padding:8px}canvas{display:block;width:100%;height:auto;border-radius:15px;border:3px solid #b9a6ff;touch-action:none}#status{min-height:32px;color:#cbd4ff;font-weight:750}#result{min-height:52px;text-align:center;font-size:clamp(24px,4vw,40px);font-weight:900}p{color:#c9d0e9}</style></head><body><main><header><div><a href="./menu.html?v=4">← 🎮 絵のメニューへ</a><h1>👐 魔法のブラックホール</h1></div><label>参加人数 <input id="count" type="number" min="2" max="40" value="40"></label></header><video id="feed" muted playsinline autoplay hidden></video><canvas id="scene" width="1200" height="760" aria-label="両手を広げるとブラックホールが成長し番号付き星が吸い込まれる公平な抽選"></canvas><div class="bar"><button id="camera">📷 両手の認識を開始</button><button id="start">▶ 宇宙を起動</button><button id="pulse">👐 引力を強める！</button><button id="sound">♪ 音 ON</button><button id="reset">↻ リセット</button><strong id="remaining">残り40個</strong></div><div id="status" role="status">両手をカメラに映して左右に広げるとブラックホールが拡大します。</div><div id="result" aria-live="polite">最後まで残る星は何番？</div><p>両手を広げると引力が強まり、番号付きの星が渦へ吸い込まれます。閉じると引力が弱まります。番号ごとの当選確率は等しく、吸い込む星は無作為に選ばれます。カメラを使えない場合は「引力を強める！」ボタンや画面タップでも遊べます。カメラ映像は端末内で処理します。</p></main><script type="module" src="./black-hole-motion.js?v=1"></script></body></html>
