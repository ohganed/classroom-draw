<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142838"><title>ペンギンの氷迷宮 | だれの番？</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#122b3b;color:#f4fafc;font-family:system-ui,-apple-system,sans-serif}main{max-width:1260px;margin:auto;padding:12px}.top,.actions,.settings{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top{justify-content:space-between}a{color:#bdeaff}h1{font-size:clamp(22px,3vw,34px);margin:6px 0}.settings label{font-weight:700}input{width:75px;padding:8px;font-size:18px;border:0;border-radius:10px}button{cursor:pointer;background:#e1f4f5;color:#123040;border:0;border-radius:10px;padding:12px 18px;font-size:17px;font-weight:800}button.primary{background:#ffcf79}button:disabled{opacity:.5}svg#field{width:100%;height:auto;display:block;background:#b4e3f0;border-radius:16px}.actions{margin-top:12px}progress{width:100%;height:11px;accent-color:#ffcf79}#status{font-size:clamp(17px,2.4vw,24px);font-weight:700;margin:12px 0}#result{min-height:55px;text-align:center;color:#ffda86;font-size:clamp(23px,4vw,42px);font-weight:900}.note{font-size:13px;color:#bcd2de;line-height:1.6}

/* Keep controls below the iPhone status bar / Dynamic Island in standalone mode. */
@media(max-width:700px){main{padding-top:max(76px,calc(env(safe-area-inset-top) + 20px));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}.top{position:relative;z-index:5}.settings button,.settings input{touch-action:manipulation}}
</style></head><body><main><div class="top"><div><a href="./menu.html?stage=1">← レトロゲーム一覧へ戻る</a><h1>🐧 ペンギンの氷迷宮</h1></div><div class="settings"><label>参加人数 <input id="count" type="number" min="1" max="40" value="40"></label><button id="sound" aria-pressed="false">♪ 音 OFF</button></div></div>
<svg id="field" viewBox="0 0 1200 740" role="img" aria-label="番号付きのペンギンが氷のブロックを押して花束を目指す" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="actions"><button id="start" class="primary">▶ スタート</button><button id="reset">↻ 氷を並べ替える</button><span id="clock">0.0 / 18秒</span></div><progress id="meter" max="18" value="0"></progress><p id="status" aria-live="polite">ペンギンたちが待機中</p><div id="result" aria-live="polite">💐 花束を手にするのは？</div>
<p class="note">番号と配置は毎回ランダム。ペンギンは氷を押して通路を開き、滑る氷に当たると少し休みます。最初に花束へ着いた番号が当選です。点滅はありません。</p></main>
<script>
'use strict';
const W=24,H=15,S=40,OX=120,OY=74,TOTAL=18000;
const $=id=>document.getElementById(id);
let round=null,playing=false,started=0,raf=0,lastSound=-1,sound=false,audio=null,elapsedBeforeHide=0;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function seed32(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]||1;}
function rng(seed){let s=seed>>>0;return ()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeRound(n,seed){
 const r=rng(seed),N=W*H,ice=new Uint8Array(N),goal={x:11+Math.floor(r()*3),y:7};
 const border=[];for(let x=0;x<W;x++)border.push([x,0]);
 for(let y=1;y<H-1;y++){border.push([0,y]);border.push([W-1,y]);}
 for(let x=0;x<W;x++)border.push([x,H-1]);
 shuffle(border,r);
 const labels=shuffle(Array.from({length:n},(_,i)=>i+1),r);
 const people=Array.from({length:n},(_,i)=>({x:border[i][0],y:border[i][1],stun:0,cool:Math.floor(r()*3),number:labels[i]}));
 const blocked=new Set(people.map(p=>p.y*W+p.x));blocked.add(goal.y*W+goal.x);
 for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
  if(Math.abs(x-goal.x)+Math.abs(y-goal.y)<2)continue;
  if(!blocked.has(y*W+x)&&r()<.225)ice[y*W+x]=1;
 }
 const frames=[],events=[];let winner=null,steps=0;
 const snap=()=>frames.push({ice:ice.slice(),people:people.map(p=>[p.x,p.y,p.stun])});snap();
 const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
 for(let step=1;step<=650;step++){
  const order=shuffle(Array.from({length:n},(_,i)=>i),r);
  for(const id of order){
   const p=people[id];if(p.stun){p.stun--;continue;}if(p.cool){p.cool--;continue;}
   const occupants=new Map(people.map((q,j)=>[q.y*W+q.x,j]));
   const options=[];
   for(const [dx,dy] of dirs){
    const x=p.x+dx,y=p.y+dy;if(x<0||x>=W||y<0||y>=H)continue;
    if(occupants.has(y*W+x))continue;
    let push=false;
    if(ice[y*W+x]){
     const bx=x+dx,by=y+dy;
     if(bx<0||bx>=W||by<0||by>=H||ice[by*W+bx]||occupants.has(by*W+bx))continue;
     push=true;
    }
    const score=Math.abs(goal.x-x)+Math.abs(goal.y-y)+r()*3+(push?.65:0);
    options.push({x,y,dx,dy,score,push});
   }
   if(!options.length){p.cool=1;continue;}
   options.sort((a,b)=>a.score-b.score);
   const q=options[r()<.15&&options.length>1?1:0],idx=q.y*W+q.x;
   if(q.push){
    let bx=q.x,by=q.y,nextX=bx+q.dx,nextY=by+q.dy;
    while(nextX>=0&&nextX<W&&nextY>=0&&nextY<H&&!ice[nextY*W+nextX]){
     if(occupants.has(nextY*W+nextX)){
      const hit=people[occupants.get(nextY*W+nextX)];if(hit!==p)hit.stun=2;
      break;
     }
     bx=nextX;by=nextY;nextX+=q.dx;nextY+=q.dy;
    }
    ice[idx]=0;ice[by*W+bx]=1;
    events.push({step,kind:'slide',x:bx,y:by});
   }
   p.x=q.x;p.y=q.y;p.cool=Math.floor(r()*2);
   if(p.x===goal.x&&p.y===goal.y){winner=p.number;steps=step;break;}
  }
  snap();if(winner)break;
 }
 if(!winner){
  const p=people[0];winner=p.number;
  while(p.x!==goal.x){p.x+=p.x<goal.x?1:-1;ice[p.y*W+p.x]=0;snap();}
  while(p.y!==goal.y){p.y+=p.y<goal.y?1:-1;ice[p.y*W+p.x]=0;snap();}
  steps=Math.max(steps+1,frames.length-1);
 }
 return {frames,events,goal,n,numbers:labels,winner,steps};
}
// SVG rendering replaces the older canvas drawing path. The board's tiles and
// penguins are separate retained elements, so a failed frame update cannot wipe it.
const NS='http://www.w3.org/2000/svg';
const svgEl=(name,props={},text='')=>{const node=document.createElementNS(NS,name);for(const [key,value] of Object.entries(props))node.setAttribute(key,String(value));if(text)node.textContent=text;return node;};
const field=$('field');let tileLayer=null,penguinLayer=null,goalLayer=null,lastPaintedIndex=-1;
function ensureBoard(){
 if(tileLayer&&penguinLayer&&goalLayer)return;
 const bg=svgEl('rect',{x:0,y:0,width:1200,height:740,fill:'#d8f2fa'});
 const board=svgEl('rect',{x:OX-10,y:OY-10,width:W*S+20,height:H*S+20,fill:'#8dc4d5'});
 tileLayer=svgEl('g',{'aria-label':'氷と通路'});goalLayer=svgEl('g',{'aria-label':'花束ゴール'});
 penguinLayer=svgEl('g',{'aria-label':'番号付きペンギン'});
 const title=svgEl('text',{x:OX,y:43,fill:'#183546','font-size':22,'font-weight':800},'氷を押すと、道が変わる！');
 field.replaceChildren(bg,board,tileLayer,goalLayer,penguinLayer,title);
}
function paint(frame,done=false){
 if(!frame||!frame.ice||!frame.people)throw Error('描画する盤面データがありません');
 ensureBoard();
 // Render all cells, then all contestants; changing a frame never clears the SVG.
 const tiles=document.createDocumentFragment();
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const px=OX+x*S,py=OY+y*S;
  tiles.append(svgEl('rect',{x:px,y:py,width:S-1,height:S-1,fill:(x+y)%2?'#b5e0eb':'#c7eaf2'}));
  if(frame.ice[y*W+x]){
   tiles.append(svgEl('rect',{x:px+2,y:py+2,width:S-4,height:S-4,fill:'#5daace'}));
   tiles.append(svgEl('rect',{x:px+5,y:py+5,width:S-12,height:8,fill:'#a8e7fc'}));
   tiles.append(svgEl('rect',{x:px+3,y:py+3,width:S-6,height:S-6,fill:'none',stroke:'#eafaff','stroke-width':2}));
  }
 }
 tileLayer.replaceChildren(tiles);
 const gx=OX+round.goal.x*S+S/2,gy=OY+round.goal.y*S+S/2;
 goalLayer.replaceChildren(svgEl('circle',{cx:gx,cy:gy,r:24,fill:'#fff2ad'}),svgEl('text',{x:gx,y:gy+10,'font-size':29,'text-anchor':'middle'},'💐'));
 const penguins=document.createDocumentFragment();
 frame.people.forEach((p,i)=>{
  const x=OX+p[0]*S+S/2,y=OY+p[1]*S+S/2,n=round.numbers[i];
  const actor=svgEl('g',{transform:'translate('+x+' '+y+')'});
  actor.append(svgEl('ellipse',{cx:0,cy:14,rx:15,ry:5,fill:'#294a6133'}));
  actor.append(svgEl('ellipse',{cx:0,cy:0,rx:14,ry:17,fill:p[2]?'#788b99':done&&n===round.winner?'#ffb542':'#233b4f'}));
  actor.append(svgEl('ellipse',{cx:0,cy:4,rx:9,ry:10,fill:'#f5f5f0'}));
  actor.append(svgEl('polygon',{points:'-4,3 4,3 0,9',fill:'#f5b04a'}));
  actor.append(svgEl('text',{x:0,y:-5,'text-anchor':'middle','font-size':12,'font-weight':800,fill:'#091e2b'},String(n)));
  penguins.append(actor);
 });
 penguinLayer.replaceChildren(penguins);
 const older=field.querySelector('#win-card');if(older)older.remove();
 if(done){
  const win=svgEl('g',{id:'win-card'});
  win.append(svgEl('rect',{x:330,y:286,width:540,height:120,rx:12,fill:'#0c2836'}));
  win.append(svgEl('text',{x:600,y:353,'text-anchor':'middle','font-size':45,'font-weight':900,fill:'#ffda7b'},round.winner+' 番が花束を獲得！'));
  field.append(win);
 }
}
function tone(freq,length=.11){if(!sound||!audio||audio.state!=='running'||document.hidden)return;const t=audio.currentTime,o=audio.createOscillator(),a=audio.createGain();o.type='triangle';o.frequency.value=freq;a.gain.setValueAtTime(.055,t);a.gain.exponentialRampToValueAtTime(.001,t+length);o.connect(a);a.connect(audio.destination);o.start(t);o.stop(t+length+.01);}
function unlock(onReady){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),a=audio.createGain();a.gain.value=.0001;o.connect(a);a.connect(audio.destination);o.start();o.stop(audio.currentTime+.03);const ready=()=>{if(sound&&audio?.state==='running'&&onReady)onReady();};const resumed=audio.resume();if(audio.state==='running')ready();else Promise.resolve(resumed).then(ready).catch(()=>{});}catch{}}
function prepare(){
 cancelAnimationFrame(raf);playing=false;
 try{
  const n=clamp(Math.floor(Number($('count').value)||40),1,40);$('count').value=n;
  round=makeRound(n,seed32());$('start').disabled=false;$('count').disabled=false;
  $('clock').textContent='0.0 / 18秒';$('meter').value=0;$('status').textContent=n+'匹が待機中';$('result').textContent='💐 花束を手にするのは？';lastPaintedIndex=0;paint(round.frames[0]);
 }catch(error){
  $('start').disabled=false;$('status').textContent='盤面の準備に失敗しました: '+(error?.message||error);
  $('result').textContent='「氷を並べ替える」を押して再試行してください';console.error('Pengo prepare failed',error);
 }
}
function tick(now){
 if(!playing||!round)return;
 try{
  const ms=Math.min(TOTAL,Math.max(0,now-started));
  const frames=round.frames;
  if(!Array.isArray(frames)||!frames.length)throw new Error('アニメーション用の盤面データがありません');
  // Use the actual frame count, not the simulation step counter, to avoid an invalid frame index.
  const idx=Math.min(frames.length-1,Math.floor((ms/TOTAL)*(frames.length-1)));
  const frame=frames[idx];
  if(!frame||!frame.ice||!frame.people)throw new Error('盤面フレームが不完全です (frame '+idx+')');
  if(idx!==lastPaintedIndex){paint(frame);lastPaintedIndex=idx;}
  $('clock').textContent=(ms/1000).toFixed(1)+' / 18秒';$('meter').value=ms/1000;
  $('status').textContent=ms<6000?'🐧 氷を押して進もう':ms<13500?'🧊 迷路がどんどん変わる！':'💐 花束が近い！';
  const beat=Math.floor(ms/350);if(beat!==lastSound){lastSound=beat;if(beat%2===0)tone(300+(beat%5)*50,.045);}
  if(ms>=TOTAL){
   playing=false;paint(frames[frames.length-1],true);$('status').textContent='花束に到着！';$('result').textContent=round.winner+' 番に決定！';$('start').disabled=false;$('count').disabled=false;
   [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.18),i*170));return;
  }
  raf=requestAnimationFrame(tick);
 }catch(error){
  console.error('Pengo animation failed',error);playing=false;cancelAnimationFrame(raf);
  $('start').disabled=false;$('count').disabled=false;
  $('status').textContent='動作を停止しました: '+(error?.message||error);
  $('result').textContent='「氷を並べ替える」を押して再試行してください';
 }
}
$('start').addEventListener('click',()=>{if(playing)return;if(!round)prepare();if(!round)return;unlock();playing=true;lastSound=-1;elapsedBeforeHide=0;started=performance.now();$('start').disabled=true;$('count').disabled=true;paint(round.frames[0]);lastPaintedIndex=0;raf=requestAnimationFrame(tick);});
$('reset').addEventListener('click',prepare);$('count').addEventListener('change',prepare);
$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent='♪ 音 '+(sound?'ON':'OFF');$('sound').setAttribute('aria-pressed',String(sound));if(sound)unlock(()=>tone(660,.15));});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden&&playing){
  elapsedBeforeHide=Math.max(0,performance.now()-started);
  cancelAnimationFrame(raf);raf=0;
  $('status').textContent='一時停止中（画面に戻ると自動再開します）';
 }else if(!document.hidden&&playing&&!raf){
  started=performance.now()-elapsedBeforeHide;
  $('status').textContent='🐧 続きから再開します';
  raf=requestAnimationFrame(tick);
 }
});
prepare();
</script></body></html>
