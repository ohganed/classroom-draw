<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b34"><title>✋ 手で消すAR抽選 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1a32;color:#f4faff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1220px;margin:auto;padding:10px}header,.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}h1{font-size:clamp(20px,3vw,35px);margin:9px 0}a{color:#aeedff}button{border:0;border-radius:12px;background:#f9cf79;color:#23334d;font-size:17px;font-weight:800;padding:12px 15px;cursor:pointer}button:disabled{opacity:.5}#scene{display:block;width:100%;height:auto;aspect-ratio:16/9;border:3px solid #74d5e8;border-radius:14px;touch-action:none;background:#203453;transform:translateZ(0)}video{display:none}#status{min-height:30px;color:#d4e8ff}#result{min-height:45px;text-align:center;font-size:clamp(22px,4vw,38px);font-weight:900}p{color:#d1deed}#stats{font-weight:800}#start{background:#a8e5bb}input{font-size:18px;width:70px;padding:8px}label{font-weight:700}#camera{background:#9fdef2} .note{font-size:14px}@media(max-width:600px){.controls button{flex:1}button{min-height:48px}}</style></head><body><main><header><div><a href="./menu.html?v=4">← 🎮 ゲームを選ぶ</a><h1>✋ 手で消す！ カメラAR抽選</h1></div><div><label>参加人数 <input id="count" type="number" min="2" max="40" value="40"></label></div></header><video id="camera-feed" playsinline muted autoplay></video><canvas id="scene" width="1200" height="675" aria-label="カメラの前に番号付きボールが重なり、手が触れたボールが消えるゲーム"></canvas><div class="controls"><button id="camera">📷 カメラと手の追跡を開始</button><button id="start">▶ 抽選スタート</button><button id="reset">↻ リセット</button><button id="sound">♪ 音 OFF</button><span id="stats">残り 40 / 40</span></div><div id="status" role="status">カメラを許可すると、手の位置を追跡します。画面をタップして消すこともできます。</div><div id="result" aria-live="polite">最後まで残る番号は？</div><p>カメラ映像の上に最大40個のボールが現れます。手のひらや指がボールに重なると消え、1秒ごとに生存ボールの番号を1〜参加人数から重複なくシャッフル。最後の1個の番号が当選です。</p><p class="note">映像は端末内で処理し、アプリから録画・送信しません。初回は手の追跡モデルのダウンロードに通信が必要です。iPad Safariのカメラ使用には許可が必要です。</p></main><script type="module" src="./hand-ar.js?v=3"></script></body></html>
