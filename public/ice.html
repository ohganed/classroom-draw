<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🧊 氷の迷宮サバイバル | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#174c82,#09172c 77%);color:#eefbff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1200px;margin:auto;padding:12px}header,.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:clamp(20px,3vw,34px);margin:8px 0}a{color:#b1f7ff}button{font-size:18px;font-weight:800;padding:12px 18px;border:0;border-radius:12px;background:#9aeaff;color:#112942;cursor:pointer}button:disabled{opacity:.55}input{width:75px;padding:8px;font-size:18px}canvas{display:block;width:100%;height:auto;border:3px solid #9be6ff;border-radius:15px;background:#123a61}#result{text-align:center;font-size:clamp(20px,3vw,32px);font-weight:850;min-height:50px;margin:12px}#status{min-height:26px}progress{width:100%;accent-color:#68e6fb}p{color:#c4dfef}</style></head><body><main><header><div><a href="./menu.html?v=4">← だれの番？へ戻る</a><h1>🧊 氷の迷宮サバイバル</h1></div><div><label>参加人数 <input id="count" type="number" min="1" max="40" value="40"></label> <button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="750" aria-label="40人の番号付きキャラクターが氷のブロックを避けて生き残る迷宮"></canvas><div class="controls"><button id="start">▶ サバイバル開始！</button><button id="reset">↻ 氷の配置を変える</button><span id="clock">0.0 / 25秒</span></div><progress id="meter" value="0" max="25"></progress><div id="status" aria-live="polite">❄️ 滑る氷ブロックに注意！</div><div id="result" aria-live="polite">最後まで残る番号は？</div><p>氷ブロックは縦・横の直線を滑り、番号にぶつかるとその番号が脱落します。終盤は氷ブロックが連続で滑り出す大逆転！ 番号は勝敗を決めるシミュレーション後にランダムに割り当て、どの番号も同じ確率で当選します。刺激の強い点滅はありません。</p></main><script type="module" src="./ice-survival.js?v=1"></script></body></html>
