<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🤖 ロボット大行進 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:#111c33;color:#f4fbff;font-family:system-ui,sans-serif}main{max-width:1220px;margin:auto;padding:12px}header,.bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}h1{margin:8px 0;font-size:clamp(22px,4vw,37px)}a{color:#adefff}button{border:0;border-radius:12px;background:#a9e9e3;color:#203348;font-size:18px;font-weight:800;padding:12px 15px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5}input{width:74px;padding:7px;font-size:18px}canvas{display:block;width:100%;height:auto;border:3px solid #a7e8e2;border-radius:15px;touch-action:none}#status{min-height:32px;color:#d4f7ee}#result{min-height:52px;text-align:center;font-size:clamp(23px,4vw,40px);font-weight:900}p{color:#c6d7e8}</style></head><body><main><header><div><a href="./menu.html?v=4">← 🎮 絵のメニューへ</a><h1>🤖 指で指令！ ロボット大行進</h1></div><label>人数 <input id="count" type="number" min="2" max="40" value="40"></label></header><video id="feed" autoplay muted playsinline hidden></video><canvas id="scene" width="1200" height="760" aria-label="指の本数で40体のロボットを全体操作する公平な抽選"></canvas><div class="bar"><button id="camera">📷 手の認識を開始</button><button id="start">▶ 行進開始</button><button id="walk">☝️ 前進</button><button id="dash">✌️ 加速</button><button id="stop">✊ 停止</button><button id="sound">♪ 音 ON</button><button id="reset">↻ リセット</button><strong id="remaining">残り40体</strong></div><div id="status" role="status">☝️ 人差し指1本で前進、✌️ 2本で加速、✊ グーで停止。カメラなしでもボタンで遊べます。</div><div id="result">最後まで進むのは何番？</div><p>ロボットは一斉に動き、障害物を越えるたび一部が脱落します。指の本数で全体の速度を操作しますが、脱落対象は生存者から無作為に選びます。番号ごとに当選確率の差はありません。カメラ映像は端末内で処理します。</p></main><script type="module" src="./robot-motion.js?v=1"></script></body></html>
