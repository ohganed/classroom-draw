<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>💣 爆弾迷宮バトル | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:#111b2c;color:#f0f5ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1280px;margin:auto;padding:12px}header,.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(20px,3vw,34px)}a{color:#bde5ff}button{font-size:18px;font-weight:760;border:0;border-radius:12px;padding:12px 18px;background:#ffd16d;color:#18253c;cursor:pointer}button:disabled{opacity:.5}input{width:72px;font-size:19px;padding:8px}canvas{display:block;width:100%;height:auto;border-radius:15px;background:#162943}#result{font-size:clamp(20px,3vw,34px);font-weight:850;text-align:center;min-height:50px;margin:12px}#status{min-height:26px}p{color:#baccdf}progress{width:100%;accent-color:#ffbf62}</style></head><body><main><header><div><a href="./menu.html?stage=1">← レトロゲーム一覧へ戻る</a><h1>💣 爆弾迷宮バトル</h1></div><div><label>参加人数 <input id="count" type="number" min="1" max="40" value="40"></label> <button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="750" aria-label="番号付き40人が爆風を避ける迷宮"></canvas><div class="controls"><button id="start">▶ バトル開始！</button><button id="reset">↻ 迷宮を再配置</button><span id="clock">0.0 / 25秒</span></div><progress id="meter" value="0" max="25"></progress><div id="status" aria-live="polite">💣 爆弾を回避して生き残れ！</div><div id="result" aria-live="polite">最後まで残るのは何番？</div><p>火柱は爆弾のマスと上下左右に伸びます。石壁は爆風を止めます。番号に火柱が触れたら脱落。終盤の連鎖爆発と、最後の生存者の脱出が見どころです。番号ごとの当選確率は均等で、音楽や効果音はオリジナルです。</p></main><script type="module" src="./bomb-maze.js?v=2"></script></body></html>
