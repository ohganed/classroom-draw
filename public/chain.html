<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚙️ からくり連鎖・ピタゴラ抽選 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#e9f4e9,#fef5d8);font-family:system-ui,-apple-system,sans-serif;color:#25384c}main{max-width:1250px;margin:auto;padding:12px}header,.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(21px,3vw,35px);color:#275d7b}a{color:#25658b}button{border:0;border-radius:12px;background:#ffc85e;color:#263342;padding:12px 17px;font-size:18px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}input{width:72px;padding:8px;font-size:18px}canvas{width:100%;height:auto;display:block;border:3px solid #7dbba3;border-radius:15px;background:#f5f9ec}#status{min-height:28px}#result{text-align:center;font-weight:850;min-height:48px;font-size:clamp(21px,3vw,33px)}progress{width:100%;accent-color:#66af92}p{color:#486574}</style></head><body><main><header><div><a href="./">← だれの番？へ戻る</a><h1>⚙️ からくり連鎖・ピタゴラ抽選</h1></div><div><label>参加人数 <input id="count" type="number" min="1" max="40" value="40"></label><button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="760" aria-label="番号付きボール40個が一本の蛇行コースでドミノ、坂道、シーソー、回転ゲートを通るからくり装置レース"></canvas><div class="bar"><button id="start">▶ からくり始動！</button><button id="reset">↻ 装置を組み直す</button><span id="clock">0.0 / 27秒</span></div><progress id="meter" max="27" value="0"></progress><div id="status">ドミノ → ハンマー → シーソー → 振り子 → 歯車 → 跳ね上げ台 → ゴール鐘</div><div id="result">最後にゴールへ飛び込むのは何番？</div><p>40個の番号付きボールが、画面いっぱいに折り返す一本の長いからくりコースを一斉に転がります。仕掛けごとの速度変化と分岐によって進む距離が変わり、27秒後に最も先へ進んだ番号が当選。番号は走行条件と独立して無作為に割り当てています。番組の映像・ロゴ・楽曲は使用せず、オリジナルの装置と効果音を使っています。</p></main><script type="module" src="./chain-reaction.js?v=3"></script></body></html>
