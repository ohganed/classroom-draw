<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🌊 ぐらぐら海賊船 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#102e56,#08162f);color:white;font-family:system-ui,-apple-system,sans-serif}main{max-width:1160px;margin:auto;padding:12px}header,.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}h1{font-size:clamp(21px,3.2vw,34px);margin:10px 0}a{color:#9cefff}button{border:0;border-radius:12px;background:#ffe08b;color:#223548;font-size:18px;font-weight:800;padding:12px 16px;touch-action:manipulation}button:disabled{opacity:.5}canvas{width:100%;height:auto;display:block;border:3px solid #6fd8e7;border-radius:16px;touch-action:none}#status,#result{font-size:20px;min-height:28px}#result{font-weight:900;text-align:center;font-size:clamp(22px,4vw,38px)}.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:390px;margin:8px auto;gap:8px}.pad button{min-height:52px;background:#9fdfe4}.pad button:active{background:#ffcb73}progress{width:100%;accent-color:#ffc869}p{color:#cbdfef}</style></head><body><main><header><div><a href="./menu.html?v=4">← 🎮 ゲームを選ぶ</a><h1>🌊 ぐらぐら海賊船・40人サバイバル</h1></div><div><button id="sensor">📱 傾きセンサーを使う</button><button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1100" height="700" aria-label="iPadの傾きで40個の番号付きボールを動かす海賊船サバイバル"></canvas><div class="bar"><button id="start">▶ 航海スタート</button><span id="clock">0.0 / 30秒</span></div><progress id="meter" value="0" max="30"></progress><div id="status">iPadを傾けるか、下の矢印ボタンを押してください。</div><div class="pad"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="center">●</button><button data-dir="right">▶</button><span></span><button data-dir="down">▼</button><span></span></div><div id="result">最後に残るのは何番？</div><p>iPadの傾きによって船上のボールが転がります。穴に落ちた番号は脱落。30秒経過時の生存ボールのうち、甲板中央に最も近い番号が当選します。番号とボールの初期条件は独立に無作為に割り当てます。iPadでセンサーを許可できない場合も矢印操作で遊べます。</p></main><script type="module" src="./pirate-tilt.js?v=1"></script></body></html>
