<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#152d36"><title>ビー玉サバイバル｜だれの番？</title><style>
*{box-sizing:border-box}body{margin:0;background:#10222b;color:#f3f1dc;font-family:system-ui,-apple-system,sans-serif;text-align:center}header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}a{color:#fff2bc}h1{font-size:clamp(19px,4vw,29px);margin:4px}p{margin:6px}main{width:min(100%,1100px);margin:auto;padding:0 10px 16px}.controls{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:6px}button,input{font:inherit}button{padding:12px 17px;background:#e0b963;color:#162a30;border:0;border-radius:12px;font-weight:800;touch-action:manipulation}button:disabled{opacity:.55}input{width:65px;border-radius:8px;padding:8px}canvas{width:100%;height:auto;display:block;border:5px solid #a8bfac;border-radius:18px;background:#436b61;touch-action:none;box-shadow:0 8px 25px #0009}.board{position:relative}.status{font-size:clamp(17px,3vw,25px);font-weight:900;color:#ffe59d;min-height:32px}.pad{display:grid;grid-template-columns:repeat(3,65px);gap:5px;justify-content:center;margin:10px}.pad button{padding:10px 0}.pad .blank{visibility:hidden}small{display:block;color:#c4d7cc;padding:6px}#win{color:#ffe188;font-size:25px;font-weight:900}</style></head><body><header><a href="./index.html">← だれの番？</a><h1>🔮 ビー玉サバイバル</h1><span>最後の1個が勝ち！</span></header><main><div class="controls"><label>参加人数 <input id="count" type="number" min="2" max="40" value="40"></label><button id="start">開始・傾きセンサーを許可</button><button id="reset">配置し直す</button><button id="mute">🔊 音 ON</button></div><p id="status" class="status">iPadを傾けてビー玉を穴に落とそう！</p><div class="board"><canvas id="board" width="900" height="630" aria-label="傾けて遊ぶビー玉サバイバル"></canvas></div><div id="win" aria-live="polite"></div><div class="pad"><span class="blank"></span><button data-dir="up">▲</button><span class="blank"></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><small>iPad：横向きに置き、少しずつ傾けて操作。センサーが使えない場合は矢印ボタン・キーボード・盤面のドラッグで操作できます。これは傾け方で結果が変わる操作ゲームです（均等確率の抽選ではありません）。</small></main><script type="module" src="./marble-survival.js?v=1"></script></body></html>
