<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🪙 メダル落とし大決戦 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#50217a,#100c30 70%);color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1270px;margin:auto;padding:12px}header,.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(21px,3vw,36px);color:#ffde5e;text-shadow:0 0 13px #ff5cd4}a{color:#7df8ff}button{cursor:pointer;background:linear-gradient(125deg,#ffdb4c,#ff7e84);color:#231335;font-size:18px;font-weight:850;padding:12px 18px;border:2px solid #fff3b6;border-radius:13px;box-shadow:0 3px 0 #b04675}button:disabled{opacity:.5}input{width:72px;padding:8px;font-size:19px}canvas{width:100%;height:auto;display:block;border:4px solid #f5cb56;border-radius:18px;box-shadow:0 0 28px #e44bf977;background:#170e30}#result{font-size:clamp(21px,3vw,34px);font-weight:900;text-align:center;min-height:48px;margin:13px}#status{min-height:28px;color:#b5fff7}progress{width:100%;accent-color:#ff76e8}p{color:#d9caef}</style></head><body><main><header><div><a href="./">← だれの番？へ戻る</a><h1>🪙 メダル落とし大決戦</h1></div><div><label>参加人数 <input id="count" type="number" min="1" max="40" value="40"></label> <button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="760" aria-label="カラフルなメダルプッシャーで40枚の番号付きメダルが押し出される"></canvas><div class="controls"><button id="start">▶ メダル投入！</button><button id="reset">↻ メダルを並べ直す</button><span id="clock">0.0 / 25秒</span></div><progress id="meter" max="25" value="0"></progress><div id="status" aria-live="polite">✨ メダルを押し出そう！</div><div id="result" aria-live="polite">最後まで残るのは何番？</div><p>番号付きメダルは台の前端を越えると落下・脱落します。押し板が往復し、終盤に強力な押し出しが発生します。ゲームの進行とメダルの位置・落下が対応し、各番号の当選確率は均等です。激しい点滅は使いません。</p></main><script type="module" src="./medal-pusher.js?v=4"></script></body></html>
