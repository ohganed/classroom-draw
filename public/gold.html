<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⛏️ 金塊争奪戦 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#61421c,#17192d 76%);color:#fff7e1;font-family:system-ui,-apple-system,sans-serif}main{max-width:1250px;margin:auto;padding:12px}header,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(22px,3vw,36px);color:#ffdb6c}a{color:#bbf1ff}button{border:0;border-radius:12px;padding:12px 18px;font-size:18px;font-weight:800;background:#ffd267;color:#332118;cursor:pointer}button:disabled{opacity:.5}input{width:72px;font-size:19px;padding:8px}canvas{display:block;width:100%;height:auto;background:#121c32;border:3px solid #e5b54e;border-radius:15px}#result{text-align:center;font-size:clamp(21px,3vw,32px);font-weight:850;min-height:45px;margin:10px}#status{min-height:27px}progress{width:100%;accent-color:#ffce62}p{color:#d9cfba}</style></head><body><main><header><div><a href="./">← だれの番？に戻る</a><h1>⛏️ 金塊争奪戦</h1></div><div><label>参加人数 <input id="count" type="number" min="1" max="40" value="40"></label> <button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="760" aria-label="40人が足場とハシゴを移動し、金塊を集めて落とし穴を避けるレトロゲーム"></canvas><div class="actions"><button id="start">▶ 金塊争奪スタート！</button><button id="reset">↻ 迷宮を作り直す</button><span id="clock">0.0 / 25秒</span></div><progress id="meter" max="25" value="0"></progress><div id="status" aria-live="polite">金塊を集め、落とし穴を避けよう！</div><div id="result" aria-live="polite">最後の1人は何番？</div><p>金塊を拾うと得点、落とし穴に落ちると脱落します。横移動・ハシゴによる上昇は実際の経路に従い、穴はキャラクターが通過した場所にだけ出現します。終盤は秘密のハシゴが開通。番号を経路にランダムに割り当て、各番号の当選確率は均等です。強い点滅はありません。</p></main><script type="module" src="./gold-rush.js?v=3"></script></body></html>
