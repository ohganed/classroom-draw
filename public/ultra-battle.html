<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17213e"><title>⚡ 光の巨人 VS 40大怪獣 | だれの番？</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#171b42,#27234e);color:#f8f8ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1200px;margin:auto;padding:12px}h1{font-size:clamp(22px,4vw,37px);margin:8px 0}a{color:#aaf0fc}button{border:0;border-radius:13px;background:#f8d781;color:#17213e;padding:12px;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.48}canvas{width:100%;height:auto;border-radius:16px;border:2px solid #b5b0ff;display:block;background:#19223b}.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0}.bar button{min-width:75px}.bar label{font-weight:700}input{font-size:17px;width:66px}#result{font-size:clamp(24px,4vw,44px);font-weight:900;text-align:center;min-height:55px}#status{min-height:30px;color:#d6eaff;font-weight:700}.moves{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}.moves button{padding:9px 3px;background:#b9ddff}@media(max-width:500px){.moves{grid-template-columns:repeat(4,1fr)}.moves button{font-size:14px}}p{line-height:1.7;color:#d5d8ef}
</style></head><body><main><a href="./menu.html">← 🎮 ゲームメニュー</a><h1>⚡ 光の巨人 VS 40大怪獣</h1><video id="feed" autoplay muted playsinline hidden></video><canvas id="stage" width="1200" height="720" aria-label="40体の番号付き怪獣が光線を受けて戦う"></canvas>
<div class="bar"><label>参加人数 <input id="count" type="number" min="2" max="40" value="40"></label><button id="camera">📷 上半身カメラ</button><button id="start">▶ 開始</button><button id="auto">▶ 自動攻撃</button><button id="reset">↻ リセット</button><button id="sound">♪ 音 ON</button><strong id="remaining">残り40体</strong></div>
<div id="moves" class="moves"><button data-move="T">Ｔ 光線</button><button data-move="PLUS">＋ 光線</button><button data-move="L">Ｌ 光線</button><button data-move="X">Ｘ 爆裂</button><button data-move="V">∧ 隕石</button><button data-move="C">Ｃ 旋風</button><button data-move="RC">逆Ｃ 旋風</button></div>
<div id="status" role="status">開始後に腕で型を作るか、下の技ボタンを押してください。</div><div id="result" aria-live="polite">最後まで残る怪獣は何番？</div>
<p>7種類の上半身ポーズで必殺技を発射します。Ｔ＝両腕を水平、＋＝片腕を上・片腕を横、Ｌ＝片腕を下・片腕を横、Ｘ＝胸前で交差、∧＝両腕を斜め上、Ｃ／逆Ｃ＝両手を胴体の左／右へ寄せる。ポーズが約0.45秒安定すると発射。同じ型を続けると連続攻撃できます。番号と怪獣能力は独立にランダム割当て。カメラ映像は端末内だけで処理します。自動攻撃・ボタンでも遊べます。</p>
</main><script type="module">
const $=id=>document.getElementById(id),cv=$('stage'),g=cv.getContext('2d'),v=$('feed'),W=1200,H=720;
const MOVES=['T','PLUS','L','X','V','C','RC'];const NAME={T:'ワイド光線',PLUS:'天空クロス',L:'エルボー光線',X:'クロス爆裂',V:'メテオ光線',C:'左サイクロン',RC:'右サイクロン'};
let monsters=[],live=false,champion=null,stream=null,detector=null,ready=false,lastVideo=-1,seen=false,poseCandidate='',poseSince=0,lastCast=0,auto=false,lastAuto=0,shots=[],sound=true,ac=null,lastFrame=0,startTime=0,raf=0;
function rnd(n){const a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function audio(){if(!sound)return;ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume().catch(()=>{})}
function tone(f=320,d=.1){if(!ac||!sound)return;const o=ac.createOscillator(),gain=ac.createGain(),t=ac.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(60,f*.35),t+d);gain.gain.setValueAtTime(.075,t);gain.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gain);gain.connect(ac.destination);o.start(t);o.stop(t+d+.01)}
function reset(){const n=Math.max(2,Math.min(40,Number($('count').value)||40));$('count').value=n;const nums=shuffle(Array.from({length:n},(_,i)=>i+1));monsters=nums.map((num,i)=>({num,x:115+(i%8)*138,y:145+Math.floor(i/8)*110,hp:100,alive:true,deadAt:0,power:.75+rnd(51)/100,phase:rnd(100)/13,hue:rnd(360)}));live=false;champion=null;auto=false;shots=[];poseCandidate='';poseSince=0;lastCast=0;startTime=0;$('start').disabled=false;$('auto').textContent='▶ 自動攻撃';$('remaining').textContent='残り'+n+'体';$('result').textContent='最後まで残る怪獣は何番？';$('status').textContent='準備完了。開始を押してください。'}
function finish(now){const survivors=monsters.filter(m=>m.alive);if(survivors.length!==1)return;champion=survivors[0];live=false;auto=false;$('start').disabled=false;$('auto').textContent='▶ 自動攻撃';$('result').textContent='🏆 '+champion.num+'番が当選！';$('status').textContent='最後の怪獣が生き残りました！';tone(760,.35)}
function fire(type,now=performance.now()){if(!live||!MOVES.includes(type)||now-lastCast<260)return;lastCast=now;audio();tone(type==='X'?180:430,.18);const alive=monsters.filter(m=>m.alive);if(alive.length<=1)return;
 // 攻撃の範囲・威力は技ごとに異なる。番号を直接参照せず実際のHPで判定。
 const cx=150+rnd(7)*140,cy=160+rnd(5)*110;
 let hits=0;
 for(const m of alive){const distance=Math.hypot((m.x-cx)/150,(m.y-cy)/110);
 let probability={T:.74,PLUS:.47,L:.53,X:.67,V:.55,C:.63,RC:.63}[type];
 if(type==='PLUS')probability*=m.x>W*.46&&m.x<W*.65?1.45:.48;
 if(type==='L')probability*=m.y<400?1.25:.62;
 if(type==='X')probability*=distance<2.5?1.35:.65;
 if(type==='V')probability*=m.y<420?1.35:.8;
 if(type==='C')probability*=m.x<W/2?1.35:.55;
 if(type==='RC')probability*=m.x>W/2?1.35:.55;
 if(rnd(10000)/10000<Math.min(.98,probability)){m.hp=Math.max(0,m.hp-(15+rnd(20))*m.power*(type==='X'?1.35:1));hits++}
 }
 // HPが同時に0になっても1体は残す。残りHPとランダム同点決着。
 const surviving=alive.filter(m=>m.hp>0);let keep=null;
 if(!surviving.length)keep=alive.slice().sort((a,b)=>b.hp-a.hp||a.phase-b.phase)[0];
 for(const m of alive){if(m.hp<=0&&m!==keep){m.alive=false;m.deadAt=now}}
 shots.push({type,at:now,cx,cy});if(shots.length>15)shots.shift();
 $('remaining').textContent='残り'+monsters.filter(m=>m.alive).length+'体';
 $('status').textContent='⚡ '+NAME[type]+'！　命中 '+hits+'体 / 残り'+monsters.filter(m=>m.alive).length+'体';
 finish(now)
}
function classify(p){const ids=[11,12,13,14,15,16];if(!ids.every(i=>p[i]&&p[i].visibility>.38))return '';
 const [ls,rs,le,re,lw,rw]=ids.map(i=>p[i]);const sw=Math.max(.07,Math.hypot(ls.x-rs.x,ls.y-rs.y)),mid=(ls.x+rs.x)/2;
 const arm=(s,w)=>{const dx=(w.x-s.x)/sw,dy=(w.y-s.y)/sw;return {dx,dy,up:dy<-.6,down:dy>.65,side:Math.abs(dx)>.85&&Math.abs(dy)<.5,diag:dy<-.5&&Math.abs(dx)>.42}};
 const l=arm(ls,lw),r=arm(rs,rw);
 if(l.side&&r.side&&Math.sign(l.dx)!==Math.sign(r.dx))return 'T';
 if((l.up&&r.side)||(r.up&&l.side))return 'PLUS';
 if((l.down&&r.side)||(r.down&&l.side))return 'L';
 if(Math.abs(lw.x-rw.x)<sw*.48&&Math.abs(lw.y-rw.y)<sw*.56&&lw.x>rw.x&&Math.abs(lw.y-(ls.y+rs.y)/2)<sw*.95)return 'X';
 if(l.diag&&r.diag&&Math.sign(l.dx)!==Math.sign(r.dx))return 'V';
 const folded=Math.hypot(lw.x-le.x,lw.y-le.y)<sw*.95&&Math.hypot(rw.x-re.x,rw.y-re.y)<sw*.95;
 if(folded&&lw.x<mid-sw*.25&&rw.x<mid-sw*.25)return 'C';
 if(folded&&lw.x>mid+sw*.25&&rw.x>mid+sw*.25)return 'RC';
 return ''}
function draw(now){const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#20365c');bg.addColorStop(1,'#35214d');g.fillStyle=bg;g.fillRect(0,0,W,H);
 for(let i=0;i<14;i++){g.fillStyle='rgba(180,210,255,.075)';g.fillRect(i*95,455-i%3*32,65,260)}
 g.fillStyle='#473d5d';g.fillRect(0,670,W,50);
 for(const m of monsters){const age=m.alive?0:(now-m.deadAt)/750;if(age>1)continue;g.save();g.globalAlpha=Math.max(0,1-age);g.translate(m.x,m.y+age*42);g.rotate((m.alive?Math.sin(now*.003+m.phase)*.07:age*1.1));const hp=Math.max(0,m.hp)/100;
 g.fillStyle='hsl('+m.hue+' 65% '+(30+hp*25)+'%)';g.beginPath();g.ellipse(0,10,34,35,0,0,Math.PI*2);g.fill();
 g.fillStyle='#f8e8ff';g.beginPath();g.arc(-12,-8,7,0,7);g.arc(12,-8,7,0,7);g.fill();g.fillStyle='#253047';g.beginPath();g.arc(-11,-8,3,0,7);g.arc(11,-8,3,0,7);g.fill();
 g.fillStyle='#e8c3ff';for(const x of [-24,0,24]){g.beginPath();g.moveTo(x-9,-23);g.lineTo(x,-43);g.lineTo(x+9,-22);g.fill()}
 g.fillStyle='#fff0be';g.fillRect(-27,19,54,25);g.fillStyle='#17233c';g.textAlign='center';g.textBaseline='middle';g.font='900 23px system-ui';g.fillText(m.num,0,32);
 g.fillStyle='#6f2135';g.fillRect(-31,-51,62,7);g.fillStyle='#7ff2a5';g.fillRect(-31,-51,62*hp,7);g.restore()}
 for(const shot of shots){const age=(now-shot.at)/600;if(age<0||age>1)continue;g.save();g.globalAlpha=(1-age)*.85;g.strokeStyle=shot.type==='X'?'#ffabde':'#b6fbff';g.lineWidth=22*(1-age)+2;g.beginPath();g.arc(shot.cx,shot.cy,70+age*180,0,Math.PI*2);g.stroke();g.restore()}
 g.fillStyle='#0a1336da';g.fillRect(0,0,W,70);g.fillStyle='#fff4b0';g.textAlign='center';g.font='bold 36px system-ui';g.fillText('⚡ 光の巨人 VS 40大怪獣',600,46);g.font='bold 22px system-ui';g.fillStyle='#bdefff';g.fillText(seen?'📷 姿勢認識中':'🎮 ボタン・自動攻撃も使用可能',600,705);
 if(champion){g.fillStyle='#0d1639ed';g.fillRect(240,250,720,200);g.strokeStyle='#ffe599';g.lineWidth=5;g.strokeRect(240,250,720,200);g.fillStyle='#ffe9a3';g.font='bold 58px system-ui';g.fillText('🏆 '+champion.num+'番 当選！',600,375)}}
function frame(now){if(ready&&detector&&v.readyState>=2&&v.currentTime!==lastVideo){lastVideo=v.currentTime;try{const result=detector.detectForVideo(v,now);const p=result.landmarks?.[0];seen=!!p;const type=p?classify(p):'';if(type!==poseCandidate){poseCandidate=type;poseSince=now}if(type&&live&&now-poseSince>=450&&now-lastCast>=900)fire(type,now)}catch(e){seen=false;$('status').textContent='姿勢認識エラー：'+e.message}}
 if(live&&auto&&now-lastAuto>750){lastAuto=now;fire(MOVES[rnd(7)],now)}
 if(live&&startTime&&now-startTime>45000){const alive=monsters.filter(m=>m.alive);if(alive.length>1){const winner=alive.slice().sort((a,b)=>b.hp-a.hp||a.phase-b.phase)[0];for(const m of alive){if(m!==winner){m.alive=false;m.deadAt=now}}$('remaining').textContent='残り1体';finish(now)}}
 draw(now);raf=requestAnimationFrame(frame)}
async function startCamera(){$('camera').disabled=true;$('status').textContent='カメラを準備中…';try{stream??=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});v.srcObject=stream;await v.play();const {PoseLandmarker,FilesetResolver}=await import('./vendor/mediapipe/vision_bundle.js?v=6');const files=await FilesetResolver.forVisionTasks(new URL('./vendor/mediapipe/wasm',import.meta.url).href);const opt={baseOptions:{modelAssetPath:new URL('./vendor/mediapipe/pose_landmarker.task',import.meta.url).href,delegate:'GPU'},runningMode:'VIDEO',numPoses:1};try{detector=await PoseLandmarker.createFromOptions(files,opt)}catch{opt.baseOptions.delegate='CPU';detector=await PoseLandmarker.createFromOptions(files,opt)}ready=true;$('status').textContent='📷 両肩・肘・手首が映る位置で7つの型を作ってください。'}catch(e){$('status').textContent='カメラを開始できません：'+e.message+'。技ボタンでも遊べます。'}finally{$('camera').disabled=false}}
$('camera').onclick=startCamera;$('start').onclick=()=>{reset();live=true;startTime=performance.now();audio();tone(620,.2);$('start').disabled=true;$('status').textContent='攻撃開始！腕の型または技ボタンを使ってください。'};$('reset').onclick=reset;
$('auto').onclick=()=>{if(!live){reset();live=true;startTime=performance.now();$('start').disabled=true}auto=!auto;$('auto').textContent=auto?'■ 自動攻撃停止':'▶ 自動攻撃';audio()};
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♪ 音 ON':'♪ 音 OFF';audio()};
for(const b of document.querySelectorAll('[data-move]'))b.onclick=()=>{if(!live){$('status').textContent='先に開始を押してください。';return}fire(b.dataset.move)};
$('count').onchange=reset;window.addEventListener('pagehide',()=>{stream?.getTracks().forEach(t=>t.stop());cancelAnimationFrame(raf)});reset();raf=requestAnimationFrame(frame);
</script></body></html>
