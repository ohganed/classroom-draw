<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔥 炎の城・最終決戦 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#653342,#131329 75%);color:#fff3e9;font-family:system-ui,-apple-system,sans-serif}main{max-width:1250px;margin:auto;padding:12px}header,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(22px,3vw,35px);color:#ffde86}a{color:#aff0ff}button{border:0;border-radius:12px;background:#ffd27c;color:#30233e;font-weight:800;font-size:18px;padding:12px 17px;cursor:pointer}button:disabled{opacity:.5}input{width:70px;padding:8px;font-size:18px}canvas{display:block;width:100%;height:auto;border:3px solid #faaa71;border-radius:15px;background:#20172d}progress{width:100%;accent-color:#ff8658}#result{text-align:center;font-size:clamp(22px,3vw,33px);font-weight:850;min-height:46px}#status{min-height:29px}p{color:#d8c8cf}</style></head><body><main><header><div><a href="./menu.html?v=4">← だれの番？に戻る</a><h1>🔥 名場面劇場 第3話：炎の城・最終決戦</h1></div><div><label>人数 <input id="count" type="number" min="1" max="40" value="40"></label> <button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="760" aria-label="40人が炎の障害を越えて橋のスイッチを競う"></canvas><div class="actions"><button id="start">▶ 炎の城へ突入！</button><button id="reset">↻ 再配置</button><span id="clock">0.0 / 25秒</span></div><progress id="meter" max="25" value="0"></progress><div id="status" aria-live="polite">回転する炎と崩れる橋を突破せよ！</div><div id="result" aria-live="polite">最後のスイッチを押すのは？</div><p>5本の橋を最大40人が横断します。火の棒と床の崩壊が各走者の実際の位置に重なったときだけ脱落。安全に飛び越える場面もあります。終盤は最後の橋が崩れ、スイッチへ大ジャンプ。番号は経路計算の後に無作為に割り当て、全員の当選確率を均等にしています。</p></main><script type="module" src="./fire-castle.js?v=1"></script></body></html>
