<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐭 トランポリン大脱走 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#463482,#101a35 75%);color:#f5f7ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1240px;margin:auto;padding:12px}header,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(21px,3vw,35px);color:#ffdf79}a{color:#b7f2ff}button{cursor:pointer;background:#ffc977;color:#271b38;border:0;border-radius:12px;font-size:18px;font-weight:800;padding:12px 18px}button:disabled{opacity:.5}input{width:72px;font-size:19px;padding:8px}canvas{display:block;width:100%;height:auto;border:3px solid #ffbce9;border-radius:15px;background:#111f42}#result{text-align:center;font-weight:850;font-size:clamp(20px,3vw,33px);min-height:48px;margin:12px}#status{min-height:26px}progress{width:100%;accent-color:#fb84d1}p{color:#d0d9ef}</style></head><body><main><header><div><a href="./">← だれの番？に戻る</a><h1>🐭 トランポリン大脱走</h1></div><div><label>人数 <input id="count" type="number" min="1" max="40" value="40"></label> <button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="760" aria-label="40人が建物の各階でトランポリンを跳び、壊れた足場から脱落する"></canvas><div class="actions"><button id="start">▶ 大脱走スタート！</button><button id="reset">↻ 再配置</button><span id="clock">0.0 / 25秒</span></div><progress id="meter" max="25" value="0"></progress><div id="status" aria-live="polite">🌀 ぴょんぴょん！ トランポリンで大脱走</div><div id="result" aria-live="polite">屋上へ逃げ切るのは何番？</div><p>安全なジャンプではトランポリンは壊れません。危険な着地ではトランポリンが破れて、その番号が脱落します。終盤は秘密の超ジャンプ台が出現！ 番号はゲームの脱落経路を生成してからランダムに割り当て、公平性を維持します。点滅の強い演出は使いません。</p></main><script type="module" src="./trampoline-escape.js?v=1"></script></body></html>
