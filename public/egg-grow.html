<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🥚 手で育てる40のタマゴ | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:#101b30;color:white;font-family:system-ui,-apple-system,sans-serif}main{max-width:1200px;margin:auto;padding:12px}h1{font-size:clamp(22px,3vw,34px);margin:8px 0}a{color:#a5f0ff}.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}button{border:0;border-radius:13px;padding:12px 16px;background:#f8d88b;color:#25354b;font-size:18px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}#play{display:block;width:100%;height:auto;border:3px solid #8de8c4;border-radius:16px;background:#273257;touch-action:none}#status{min-height:30px;font-weight:700;color:#ccebdc}#result{text-align:center;font-weight:900;font-size:clamp(24px,4vw,39px);min-height:50px}p{color:#cbdaed}input{font-size:18px;width:72px;padding:7px}progress{width:100%;accent-color:#aaf1c3}</style></head><body><main><div class="bar"><div><a href="./menu.html?v=4">← 🎮 絵のメニューへ</a><h1>🥚 手で育てる！ 光るタマゴ</h1></div><label>参加人数 <input id="count" type="number" min="2" max="40" value="40"></label></div><video id="feed" playsinline muted autoplay hidden></video><canvas id="play" width="1200" height="675" aria-label="カメラ映像に映る手で40個の光るタマゴを育てる"></canvas><div class="bar"><button id="camera">📷 手の認識を開始</button><button id="start">▶ 25秒育成スタート</button><button id="sound">♪ 音 ON</button><button id="reset">↻ リセット</button><span id="clock">0.0 / 25秒</span></div><progress id="meter" max="25" value="0"></progress><div id="status">カメラに手を映して、タマゴをなでてください。</div><div id="result">一番育つのは何番？</div><p>手や指がタマゴに重なると成長します。触れると音が鳴り、大きくなるほど音階が上がります。25秒で成長量が最大のタマゴが優勝。番号は最後に公平にシャッフルして当選を決めます。カメラが使えない場合は画面をタッチして遊べます。カメラ映像は送信・録画しません。</p></main><script type="module" src="./egg-grow.js?v=1"></script></body></html>
