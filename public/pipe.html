<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🟢 土管ワープ大逆転 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#203c69,#121c38);color:white;font-family:system-ui,-apple-system,sans-serif}main{max-width:1250px;margin:auto;padding:12px}header,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(21px,3vw,35px);color:#ffe485}a{color:#a9efff}button{padding:12px 18px;border:0;border-radius:12px;background:#ffe081;font-size:18px;font-weight:800;color:#24334e;cursor:pointer}button:disabled{opacity:.5}input{width:74px;font-size:18px;padding:8px}canvas{display:block;width:100%;height:auto;background:#86c9f5;border-radius:15px;border:3px solid #a8f5a5}#result{text-align:center;min-height:45px;font-size:clamp(20px,3vw,31px);font-weight:800}#status{min-height:28px}progress{width:100%;accent-color:#74df96}p{color:#d9e7f9}</style></head><body><main><header><div><a href="./menu.html?v=4">← だれの番？へ戻る</a><h1>🟢 名場面劇場 第1話：土管ワープ大逆転</h1></div><div><label>参加人数 <input id="count" type="number" value="40" min="1" max="40"></label><button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="760" aria-label="40人の番号が土管に飛び込んで別の位置から出現し、ゴールを争うゲーム"></canvas><div class="actions"><button id="start">▶ レース開始！</button><button id="reset">↻ 再抽選</button><span id="clock">0.0 / 25秒</span></div><progress id="meter" max="25" value="0"></progress><div id="status" aria-live="polite">🏁 40人が同時スタート！ 土管の出口は毎回変わります。</div><div id="result" aria-live="polite">誰が一番遠くまで進む？</div><p>ゲーム内の各番号は同じまま、土管に入って別の地点から出現します。ワープで先頭・後方へ大きく移動し、最後に最も進んだ番号が当選します。結果を計算してから番号を無作為に割り当てて公平性を維持。キャラクター・背景・音は独自の演出です。</p></main><script type="module" src="./pipe-warp.js?v=1"></script></body></html>
