function setup(n,seed){

 for(let i=finalists.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[finalists[i],finalists[j]]=[finalists[j],finalists[i]];}

function lerpPath(points,t){const segments=points.length-1,v=clamp(t,0,1)*segments,i=Math.min(segments-1,Math.floor(v)),k=v-i;return {x:points[i][0]+(points[i+1][0]-points[i][0])*k,y:points[i][1]+(points[i+1][1]-points[i][1])*k};}

 if(sec<17)return [0,1,2,3,4];
 if(sec<24)return [round.winningLane,round.losers[0],round.losers[1]];

}
function updateCandidates(sec){
 const active=new Set(activeLanes(sec)),candidateNumbers=new Set();
 active.forEach(lane=>round.passengers[lane].forEach(n=>candidateNumbers.add(n)));

  candidateNumbers.clear();round.finalists.forEach(n=>candidateNumbers.add(n));
 }
 for(let n=1;n<=round.n;n++){
  const node=$('number-'+n);if(!node)continue;

function paintTrain(progress){
 const sec=progress*30,active=new Set(activeLanes(sec)),trains=$('trains');
 trains.replaceChildren();
 RAILS.forEach((line,i)=>{
  // Changes in speed are visual cues, while the winner was drawn uniformly
  // before departure. Eliminated trains slow down instead of disappearing.
  const retained=active.has(i);
  let t=progress*(.83+(i*.022));
  if(sec>=17&&!retained)t=Math.min(t,.42+(i%3)*.025);
  if(sec>=24&&!retained)t=Math.min(t,.60+(i%3)*.025);
  if(sec>=29&&i===round.winningLane)t=Math.max(t,.73+(progress-29/30)*2.7);
  if(sec>=29&&!retained)t=Math.min(t,.71+(i%3)*.015);

  const p=lerpPath(line,t),q=lerpPath(line,Math.min(1,t+.003));
  const angle=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI;
  const group=el('g',{transform:'translate('+p.x+' '+p.y+') rotate('+angle+')',filter:'url(#shadow)',opacity:retained?1:.42});

 $('distance').textContent='あと '+Math.max(0,Math.ceil((1-progress)*8))+' 駅';

}

 for(let i=-2;i<=2;i++)stage.append(el('path',{d:'M '+(974+i*6)+' 418 l 27 29',stroke:'#f5c97a','stroke-width':4,'stroke-linecap':'round'}));
 stage.append(el('text',{x:988,y:565,'text-anchor':'middle','font-size':24,'font-weight':800,fill:'#7f4b38'},'🍈 メロンパン売り切れ間近'));
 stage.append(el('path',{d:'M 340 616 H 822',stroke:'#a89173','stroke-width':9,'stroke-dasharray':'14 17'}));

}
function bakeryRunners(sec,finished=false){
 const run=$('runners');run.replaceChildren();
 const elapsed=Math.max(0,sec-33),p=clamp(elapsed/15,0,1);
 const entrants=round.passengers[round.winningLane];
 const r=rng(round.seed^0x68bdc5a1);
 const order=entrants.slice().sort((a,b)=>a-b);
 // Slots stay fixed throughout the race; every character remains the
 // same person, and none jumps to another character's position.
 const slots=new Map(order.map((number,i)=>[number,i]));
 const contenders=new Set(round.finalists);
 for(const number of order){
  const slot=slots.get(number),survivor=contenders.has(number);
  // The predetermined winner reaches the final bun, other passengers reach
  // different distances without ever reversing direction.
  const pace=number===round.winner?1:survivor?.80+((number*19+round.seed)%10)/100:.60+((number*13+round.seed)%13)/100;
  const raw=clamp((elapsed/15)*pace,0,1);
  const eased=raw*raw*(3-2*raw);
  const x=365+eased*623;
  const launchY=330+slot*36;
  const targetY=435+(number===round.winner?0:(slot-3)*6);
  const y=launchY+(targetY-launchY)*eased+Math.sin(elapsed*8+slot)*Math.min(4,elapsed*2)*(1-eased);
  const bounce=p>0&&p<1?Math.abs(Math.sin(elapsed*9+slot))*7:0;
  const person=el('g',{transform:'translate('+x+' '+(y-bounce)+')',opacity:sec>=40&&!survivor?.5:1});
  person.append(el('ellipse',{cx:0,cy:19,rx:19,ry:6,fill:'#426477',opacity:.25}));
  person.append(el('circle',{cx:0,cy:-10,r:13,fill:'#ffe4bb',stroke:'#68483c','stroke-width':2}));
  person.append(el('rect',{x:-15,y:2,width:30,height:25,rx:9,fill:COLORS[slot%5],stroke:'#fff','stroke-width':3}));
  person.append(el('text',{x:0,y:20,'text-anchor':'middle','font-size':18,'font-weight':950,fill:'#142e40'},String(number)));
  person.append(el('path',{d:'M -8 27 l -5 10 M 8 27 l 5 10',stroke:'#273d52','stroke-width':4,'stroke-linecap':'round'}));
  run.append(person);
 }
 const effects=$('bakeryEffects');effects.replaceChildren();
 if(sec>=45&&sec<48)effects.append(el('text',{x:600,y:678,'text-anchor':'middle','font-size':43,'font-weight':950,fill:'#9d4b2d'},'💓 あと少し！メロンパンは誰の手に？'));
 if(finished){
  effects.append(el('rect',{x:900,y:397,width:180,height:90,rx:22,fill:'#ffdc80',stroke:'#a8793b','stroke-width':6}));
  effects.append(el('text',{x:989,y:453,'text-anchor':'middle','font-size':49},'🥐'));
 }
 $('station').textContent='スターライト駅前';
 $('distance').textContent=finished?'メロンパン獲得！':'パン屋まで '+Math.max(0,Math.ceil((1-p)*100))+' m';
 $('eventCount').textContent='最終勝負';
 updateCandidates(sec);
 $('status').textContent=finished?'🎉 '+round.winner+'番が最後のメロンパンをゲット！':sec<40?'🏃 改札からパン屋へ！'+entrants.length+'人がダッシュ！':sec<45?'💓 最後の'+round.finalists.length+'人に絞られた！':'🥐 最後のメロンパン1個を奪い合う！';
}
function paintScene(sec,finished=false){
 const map=sec<33,transition=sec>=30&&sec<33;
 $('transitionStage').setAttribute('display',transition?'inline':'none');
 $('bakeryStage').setAttribute('display',sec>=33?'inline':'none');
 if(map)paintTrain(clamp(sec/30,0,1));
 if(sec>=33)bakeryRunners(sec,finished);
 $('meter').value=Math.min(48,sec);
 if(finished){$('winnerBanner').setAttribute('opacity',1);$('winnerText').textContent=round.winner+' 番';}
}
function badges(sec){
 const badge=$('eventBadge');let current=-1;
 for(let i=0;i<4;i++){if(sec>=6.9*(i+1)&&sec<6.9*(i+1)+2.5)current=i;}
 if(current<0){badge.setAttribute('opacity',0);return;}
 badge.setAttribute('opacity',1);
 $('eventEmoji').textContent=EVENTS[current][0];$('eventLabel').textContent=EVENTS[current][1];
 $('status').textContent=EVENTS[current][1];
}
function displayNumbers(){
 const zone=$('lineup');zone.replaceChildren();
 const trainList=$('trainList');trainList.replaceChildren();
 round.passengers.forEach((group,lane)=>{const card=document.createElement('div');card.style.setProperty('--train',COLORS[lane]);const head=document.createElement('strong');head.textContent='🚃 '+(lane+1)+'号列車';const names=document.createElement('small');names.textContent=group.length?group.join('・')+' 番':'乗客なし';card.append(head,names);trainList.append(card);});
 for(let i=1;i<=round.n;i++){const span=document.createElement('span');span.textContent=i;span.id='number-'+i;zone.append(span);}
}
function soundReady(){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();}catch{}}
function beep(frequency=450,len=.1){if(!sound||!audio||audio.state!=='running'||document.hidden)return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(frequency,t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.06,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+len+.01);}
function prepare(){
 cancelAnimationFrame(raf);playing=false;pausedElapsed=0;
 const n=clamp(Math.floor(Number($('count').value)||40),1,40);$('count').value=n;
 round=setup(n,crypto.getRandomValues(new Uint32Array(1))[0]);
 drawCity(round.seed);buildBakery();displayNumbers();
 $('winnerBanner').setAttribute('opacity',0);$('eventBadge').setAttribute('opacity',0);
 $('clock').textContent='0.0 / 48秒';$('result').textContent='';$('phase').textContent='待機中';
 $('status').textContent='🏙️ '+n+'人の番号が出発を待っています。';
 $('start').disabled=false;$('count').disabled=false;paintScene(0);
}
function tick(now){
 if(!playing)return;raf=0;
 const ms=clamp(now-started,0,DURATION),sec=ms/1000;
 paintScene(sec);if(sec<30)badges(sec);else $('eventBadge').setAttribute('opacity',0);
 $('clock').textContent=sec.toFixed(1)+' / 48秒';
 $('phase').textContent=sec<17?'5列車が競走中':sec<24?'3列車に絞られた':sec<29?'2列車の接戦':sec<30?'最後の1列車':sec<33?'改札へ移動中':sec<40?'全員ダッシュ':sec<45?'残り'+round.finalists.length+'人':sec<48?'最後のメロンパン争奪！':'決着';
 const beat=Math.floor(sec*2);if(beat!==lastBeat){lastBeat=beat;if(beat%2===0)beep(sec>=33?540+(beat%5)*70:310+(beat%6)*57,.08);}
 if(ms>=DURATION){
  playing=false;paintScene(48,true);$('eventBadge').setAttribute('opacity',0);
  $('status').textContent='🥐 '+round.winner+'番が最後のメロンパンをゲット！';
  $('result').textContent='🎉 '+round.winner+' 番に決定！';
  $('phase').textContent='メロンパン獲得！';$('start').disabled=false;$('count').disabled=false;
  $('number-'+round.winner)?.classList.add('win');
  [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.22),i*190));return;
 }
 raf=requestAnimationFrame(tick);
}
$('start').onclick=()=>{if(playing)return;prepare();playing=true;started=performance.now();lastBeat=-1;pausedElapsed=0;soundReady();$('start').disabled=true;$('count').disabled=true;raf=requestAnimationFrame(tick);};
$('reset').onclick=prepare;$('count').onchange=prepare;
$('sound').onclick=()=>{sound=!sound;$('sound').textContent='♪ 音 '+(sound?'ON':'OFF');$('sound').setAttribute('aria-pressed',String(sound));if(sound){soundReady();beep(620,.1)}};
$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else WORLD.requestFullscreen?.().catch(()=>{})};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){pausedElapsed=performance.now()-started;cancelAnimationFrame(raf);raf=0;}else if(!document.hidden&&playing&&!raf){started=performance.now()-pausedElapsed;raf=requestAnimationFrame(tick);}});
prepare();
</script></body></html>
