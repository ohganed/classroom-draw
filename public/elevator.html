<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🛗 エレベーター大混戦 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#26336f,#11152b 80%);color:#f8f7ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1240px;margin:auto;padding:12px}header,.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(21px,3vw,35px);margin:9px 0;color:#ffe588}a{color:#a5f0ff}button{border:0;border-radius:11px;padding:12px 17px;background:#ffd36e;color:#241939;font-weight:800;font-size:18px;cursor:pointer}button:disabled{opacity:.5}input{width:74px;padding:7px;font-size:18px}canvas{display:block;width:100%;height:auto;border:3px solid #aa95ff;border-radius:14px;background:#161e3f}#result{text-align:center;font-size:clamp(21px,3vw,32px);font-weight:850;min-height:48px;margin:10px}#status{min-height:26px;color:#d6ecff}progress{width:100%;accent-color:#ffe070}p{color:#bdcbea}</style></head><body><main><header><div><a href="./">← だれの番？へ戻る</a><h1>🛗 エレベーター大混戦</h1></div><div><label>参加人数 <input id="count" type="number" min="1" max="40" value="40"></label> <button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="760" aria-label="40人の番号付きキャラクターが10階建てビルのエレベーターで移動して脱出を競う"></canvas><div class="controls"><button id="start">▶ エレベーター始動！</button><button id="reset">↻ 配置を変える</button><span id="clock">0.0 / 25秒</span></div><progress id="meter" max="25" value="0"></progress><div id="status" aria-live="polite">🚪 危険な階にはご注意！</div><div id="result" aria-live="polite">屋上の花束に到着するのは？</div><p>各番号はエレベーターで移動。危険な階に着いた番号は脱落します。終盤は急行エレベーターが動き、大逆転！ 勝敗と建物内の経路を先に決め、番号はその後ランダムに割り当てます。点滅の激しい演出は使いません。</p></main><script type="module" src="./elevator-chaos.js?v=1"></script></body></html>
