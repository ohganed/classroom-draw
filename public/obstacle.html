<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🏃 障害物サバイバル | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#15182d,#243c45);font-family:system-ui,sans-serif;color:#f6f9f7}main{max-width:1250px;margin:auto;padding:12px}header,.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(21px,3vw,36px);color:#ffe08e}a{color:#9ce9ff}button{border:0;border-radius:12px;background:#ffcc6b;color:#28323e;font-size:18px;font-weight:800;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5}input{width:75px;padding:8px;font-size:18px}canvas{width:100%;height:auto;display:block;border:3px solid #6ee4bc;border-radius:14px;background:#1d293e}progress{width:100%;accent-color:#ffcf69}#status{min-height:29px}#result{text-align:center;font-size:clamp(20px,3vw,33px);font-weight:800;min-height:46px}p{color:#c4d9e1}</style></head><body><main><header><div><a href="./menu.html?v=4">← だれの番？に戻る</a><h1>🏃 障害物サバイバル — 完全制覇への挑戦</h1></div><div><label>参加人数 <input id="count" type="number" min="1" max="40" value="40"></label> <button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="760" aria-label="40人が5列の障害物コースを同時に進み落下と突破を競うゲーム"></canvas><div class="bar"><button id="start">▶ 挑戦開始！</button><button id="reset">↻ コース再挑戦</button><span id="clock">0.0 / 30秒</span></div><progress id="meter" max="30" value="0"></progress><div id="status">飛び石 → 回転丸太 → 揺れる橋 → 反り立つ壁</div><div id="result">完全制覇するのは何番？</div><p>40人が同時に障害へ挑戦。障害物で失敗した番号は、その場で落下して脱落。安全に通過した番号は次へ進みます。最後の反り立つ壁を突破する1人が当選。番号は結果とは独立にランダム割当して公平性を保ちます。独自デザインと電子効果音を使用しています。</p></main><script type="module" src="./obstacle-survival.js?v=1"></script></body></html>
