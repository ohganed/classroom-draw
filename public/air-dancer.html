<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🌬️ エアダンサー40人 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:#111a33;color:#f7f5ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1220px;margin:auto;padding:12px}header,.bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:9px}h1{font-size:clamp(22px,4vw,37px);margin:7px 0}a{color:#a6efff}button{border:0;border-radius:12px;background:#bce7fa;color:#1e3249;padding:11px 14px;font-size:17px;font-weight:850;touch-action:manipulation;cursor:pointer}button:disabled{opacity:.45}input{font-size:18px;width:76px;padding:8px}canvas{width:100%;height:auto;display:block;border:3px solid #b7e9ff;border-radius:15px;touch-action:none}#status{min-height:32px;color:#d8f2ff;font-weight:700}#result{min-height:50px;text-align:center;font-size:clamp(23px,4vw,39px);font-weight:900}p{color:#c6d7e8}</style></head><body><main><header><div><a href="./menu.html?v=4">← 🎮 絵のゲームメニューへ</a><h1>🌬️ エアダンサー40人</h1></div><label>人数 <input id="count" type="number" min="2" max="40" value="40"></label></header><video id="feed" playsinline autoplay muted hidden></video><canvas id="stage" width="1200" height="760" aria-label="40体のエアダンサーが上半身で生み出す風に耐える抽選ゲーム"></canvas><div class="bar"><button id="camera">📷 上半身認識開始</button><button id="start">▶ スタート</button><button id="left">🌬️ 左へ風</button><button id="right">🌬️ 右へ風</button><button id="gust">💨 突風！</button><button id="sound">♪ 音 ON</button><button id="reset">↻ リセット</button><strong id="remaining">残り40体</strong><strong id="tempo">100 BPM</strong></div><div id="status" role="status">左右の腕と肩を動かして風を起こそう。カメラを使わない場合は風ボタンでも遊べます。</div><div id="result" aria-live="polite">最後まで立っている番号は？</div><p>先生の腕・肩の動きが風の強さと向きに反映されます。風の中で人形が揺れ、耐えきれなくなると飛ばされます。脱落者は事前には決めず、各人形の動きと姿勢から決まります。番号は開始ごとに無作為に配置されるため、どの番号にも同じ条件です。カメラ映像は端末内で処理します。</p></main><script type="module" src="./air-dancer.js?v=1"><
