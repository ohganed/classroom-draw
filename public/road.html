<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🚗 ハラハラ道路横断 | だれの番？</title><style>*{box-sizing:border-box}body{margin:0;background:#101c2a;color:#eef5ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1250px;margin:auto;padding:12px}header,.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(22px,3vw,34px)}a{color:#aee3ff}button{font-size:18px;font-weight:750;border:0;border-radius:12px;padding:12px 18px;background:#ffd172;color:#182232;cursor:pointer}button:disabled{opacity:.5}input{width:75px;font-size:19px;padding:7px}canvas{display:block;width:100%;height:auto;border-radius:15px;background:#20394b}#result{font-size:clamp(20px,3vw,32px);font-weight:850;text-align:center;min-height:52px;margin:12px}#status{min-height:25px}p{color:#bbcedb}progress{width:100%;accent-color:#ffcd74}</style></head><body><main><header><div><a href="./">← だれの番？に戻る</a><h1>🚗 ハラハラ道路横断</h1></div><div><label>人数 <input id="count" type="number" min="1" max="40" value="40"></label> <button id="sound">♪ 音 OFF</button></div></header><canvas id="game" width="1200" height="720" aria-label="車を避けて道路を横断する40人の番号付きキャラクター"></canvas><div class="controls"><button id="start">▶ 横断スタート！</button><button id="reset">↻ 再配置</button><span id="clock">0.0 / 25秒</span></div><progress id="meter" max="25" value="0"></progress><div id="status" aria-live="polite">🚦 青信号を待っています</div><div id="result" aria-live="polite">最後まで生き残るのは何番？</div><p>車に接触した番号から脱落します。終盤は車が増え、地下通路による大逆転も！ 当選者は開始時に均等な確率で選び、その番号が実際の横断結果でも最後に残るように車の走行を組み立てます。安全のため激しい点滅はありません。</p></main><script type="module" src="./road-crossing.js?v=1"></script></body></html>
