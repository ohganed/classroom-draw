<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101c30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="教室のための、1〜40番のシンプルな抽選アプリ。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
<title>だれの番？ — 教室の抽選</title>
</head>
<body>
<main id="app">
<header><div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><h1>だれの番？</h1><span class="range">1–40</span></div><div class="tools"><button id="sound" aria-pressed="false">音 OFF</button><button id="fullscreen" hidden>全画面</button></div></header>
<section class="stage" aria-label="抽選番号">
 <div class="halo" aria-hidden="true"></div>
 <p id="status">次の主役は、だれだろう。</p>
 <div id="number" aria-hidden="true">?</div>
 <p id="caption">1〜40番から、ひとりを選びます</p>
 <div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>
</section>
<footer><button id="start" class="primary">抽選スタート <span aria-hidden="true">↗</span></button><p id="hint">タップすると、8秒で決まります</p><p class="install">ホーム画面に追加すると、アプリとして使えます</p></footer>
<p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
</main>
<noscript>このアプリを使うにはJavaScriptを有効にしてください。</noscript>
<script type="module" src="./app.js"></script>
</body></html>
