<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101c30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="教室のための、1〜40番のシンプルな抽選アプリ。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
<title>だれの番？ — 教室の抽選</title>
</head>
<body>
<main id="app">
<header><div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><h1>だれの番？</h1><span id="range" class="range">1–40</span></div><div class="tools"><label class="count-label">人数 <input id="count" type="number" inputmode="numeric" min="1" max="99" step="1" value="40" aria-label="生徒の人数"> 人</label><label class="count-label">時間 <select id="duration" aria-label="抽選時間"><option value="3000">3秒</option><option value="5000">5秒</option><option value="8000" selected>8秒</option></select></label><label class="count-label">モード <select id="mode" aria-label="抽選モード"><option value="numbers">数字</option><option value="die">40面体サイコロ</option><option value="lottery">ガラガラ抽選機</option><option value="roulette">40分割ルーレット</option><option value="race">ボールレース</option><option value="horse">競馬レース</option><option value="pinball">ピンボール抽選</option><option value="galton">ガルトンボード抽選</option><option value="maze">迷路脱出競争</option><option value="crane">クレーンゲーム抽選</option><option value="machine">巨大からくり装置</option><option value="karakuri">巨大からくり抽選 NEW</option><option value="robot">ロボット障害物競走</option><option value="baby">赤ちゃんこっちモード</option></select></label><button id="sound" aria-pressed="false">音 OFF</button><button id="fullscreen" hidden>全画面</button></div></header>
<section class="stage" aria-label="抽選番号">
 <div class="halo" aria-hidden="true"></div>
 <p id="status">次の主役は、だれだろう。</p>
 <div id="die-wrap" hidden aria-hidden="true"><canvas id="die" width="480" height="480"></canvas></div><div id="lottery-wrap" hidden aria-hidden="true"><canvas id="lottery" width="520" height="450"></canvas></div><div id="roulette-wrap" hidden aria-hidden="true"><canvas id="roulette" width="520" height="520"></canvas></div><div id="race-wrap" hidden aria-hidden="true"><canvas id="race" width="600" height="450"></canvas></div><div id="horse-wrap" hidden aria-hidden="true"><canvas id="horse" width="600" height="450"></canvas></div><div id="pinball-wrap" hidden aria-hidden="true"><canvas id="pinball" width="600" height="520"></canvas></div><div id="galton-wrap" hidden aria-hidden="true"><canvas id="galton" width="600" height="530"></canvas></div><div id="maze-wrap" hidden aria-hidden="true"><canvas id="maze" width="600" height="470"></canvas></div><div id="crane-wrap" hidden aria-hidden="true"><canvas id="crane" width="600" height="470"></canvas></div><div id="machine-wrap" hidden><canvas id="machine" width="600" height="460"></canvas></div><div id="robot-wrap" hidden aria-hidden="true"><canvas id="robot" width="600" height="470"></canvas></div><div id="karakuri-wrap" hidden aria-hidden="true"><canvas id="karakuri" width="600" height="490"></canvas></div><div id="baby-wrap" hidden aria-hidden="true"><canvas id="baby" width="600" height="470"></canvas></div><div id="number" aria-hidden="true">?</div>
 <p id="caption">1〜40番から、ひとりを選びます</p>
 <div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>
</section>
<footer><button id="start" class="primary">抽選スタート <span aria-hidden="true">↗</span></button><p id="hint">タップすると、8秒で決まります</p><p class="install">ホーム画面に追加すると、アプリとして使えます</p></footer>
<p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
</main>
<noscript>このアプリを使うにはJavaScriptを有効にしてください。</noscript>
<script type="module" src="./app.js?v=61"></script>
</body></html>
